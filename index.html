<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartTakeoff</title>
<script src="lib/pdf.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2330; --muted:#677084; --line:#dde1e8;
  --accent:#d9480f; --accent-ink:#fff; --hover:#eef1f5; --sel:#fff4e6; --viewer:#c9ced8;
  --danger:#c92a2a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181e; --panel:#1d2129; --ink:#e7eaf0; --muted:#98a1b3; --line:#2f3542;
    --accent:#ff7a3d; --accent-ink:#15181e; --hover:#262b35; --sel:#3a2a1d; --viewer:#0f1115; --danger:#ff6b6b;
  }
}
:root[data-theme="dark"]{
  --bg:#15181e; --panel:#1d2129; --ink:#e7eaf0; --muted:#98a1b3; --line:#2f3542;
  --accent:#ff7a3d; --accent-ink:#15181e; --hover:#262b35; --sel:#3a2a1d; --viewer:#0f1115; --danger:#ff6b6b;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{background:var(--hover)}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
#app{display:grid;height:100vh;grid-template-rows:auto 1fr auto;grid-template-columns:270px 1fr}
header{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:700;letter-spacing:.2px;margin-right:6px}
header .brand span{color:var(--accent)}
.grp{display:flex;gap:3px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.tool kbd{font-size:10px;opacity:.6;margin-left:3px}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h3{margin:0;padding:10px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
#condList{overflow:auto;flex:1;padding:0 6px 6px}
.cond{display:flex;align-items:center;gap:7px;padding:6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.cond:hover{background:var(--hover)}
.cond.active{background:var(--sel);border-color:var(--accent)}
.cond .sw{width:12px;height:12px;border-radius:3px;flex:none}
.cond .nm{flex:1;min-width:0}
.cond .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cond .nm small{color:var(--muted)}
.cond .q{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;text-align:right}
.cond .ed{visibility:hidden;padding:1px 6px}
.cond:hover .ed{visibility:visible}
#pageList{max-height:28vh;overflow:auto;padding:0 6px 8px;display:flex;flex-wrap:wrap;gap:4px}
#pageList button{min-width:36px}
main{display:grid;grid-template-rows:1fr 230px;grid-template-columns:minmax(0,1fr);min-height:0;min-width:0}
#viewer{position:relative;overflow:auto;background:var(--viewer);min-height:0}
#stage{position:relative;margin:24px;display:inline-block;box-shadow:0 2px 12px rgba(0,0,0,.25);background:#fff}
#pdfCanvas{display:block}
#overlay{position:absolute;left:0;top:0;user-select:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--ink);text-align:center;padding:16px}
#empty .box{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:28px 34px;max-width:460px}
#empty h2{margin:0 0 6px;font-size:18px}
#empty p{margin:0 0 14px;color:var(--muted)}
#viewer.drag #empty .box{border-color:var(--accent)}
#bottom{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
#tabs .sp{flex:1}
#tableWrap{overflow:auto;flex:1}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);z-index:1}
td.n,th.n{text-align:right}
tr.sel td{background:var(--sel)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
footer{grid-column:1/3;display:flex;gap:14px;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer b{color:var(--ink);font-weight:600}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
#modal{background:var(--panel);border-radius:10px;padding:16px 18px;min-width:320px;max-width:560px;width:calc(100% - 32px);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#modal h3{margin:0 0 12px;font-size:15px}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;align-items:center}
.form label{color:var(--muted)}
.form input,.form select{width:100%}
.form .row2{display:flex;gap:6px}
.form .hint{grid-column:1/3;color:var(--muted);font-size:12px;margin-top:-2px}
.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw}
#toast.show{opacity:.95}
.nocal{color:var(--danger);font-weight:600}
svg text{font-family:system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Smart<span>Takeoff</span></div>
    <div class="grp">
      <button id="btnOpen" title="Abrir plano PDF">Abrir PDF</button>
      <input id="filePdf" type="file" accept="application/pdf,.pdf" hidden>
      <button id="btnSave" title="Guardar proyecto (.json)">Guardar</button>
      <button id="btnLoad" title="Abrir proyecto (.json)">Abrir proyecto</button>
      <input id="fileJson" type="file" accept=".json,application/json" hidden>
    </div>
    <div class="grp" id="tools">
      <button class="tool" data-tool="select" title="Seleccionar / mover (V)">Seleccionar<kbd>V</kbd></button>
      <button class="tool" data-tool="calibrate" title="Calibrar escala con una cota conocida (K)">Calibrar<kbd>K</kbd></button>
      <button class="tool" data-tool="linear" title="Medición lineal (L)">Lineal<kbd>L</kbd></button>
      <button class="tool" data-tool="area" title="Medición de área (A)">Área<kbd>A</kbd></button>
      <button class="tool" data-tool="count" title="Conteo (C)">Conteo<kbd>C</kbd></button>
      <button class="tool" data-tool="cloud" title="Nube de revisión (R)">Nube<kbd>R</kbd></button>
      <button class="tool" data-tool="text" title="Nota de texto (T)">Texto<kbd>T</kbd></button>
    </div>
    <div class="grp">
      <select id="scaleSel" title="Escala de la página"></select>
    </div>
    <div class="grp">
      <button id="zoomOut" title="Alejar (-)">−</button>
      <span id="zoomLbl" style="min-width:44px;text-align:center">100%</span>
      <button id="zoomIn" title="Acercar (+)">+</button>
      <button id="zoomFit" title="Ajustar a la ventana">Ajustar</button>
    </div>
    <div class="grp">
      <button id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <button id="redo" title="Rehacer (Ctrl+Y)">↷</button>
    </div>
    <div class="grp">
      <select id="uiLang" title="Idioma de la app"><option value="en">English</option><option value="es">Español</option></select>
      <select id="unitsSel" title="Sistema de unidades">
        <option value="imperial">Imperial (ft, in)</option>
        <option value="metric">Métrico (m, mm)</option>
      </select>
    </div>
  </header>

  <aside>
    <h3>Condiciones <span><button id="btnImportCond" title="Importar condiciones desde Excel">Importar</button> <button id="btnNewCond" class="primary" title="Nueva condición">+ Nueva</button></span></h3>
    <input id="fileCond" type="file" accept=".xlsx,.xls,.csv" hidden>
    <div id="condList"></div>
    <h3>Páginas <span id="pageInfo"></span></h3>
    <div id="pageList"></div>
  </aside>

  <main>
    <div id="viewer">
      <div id="stage" hidden>
        <canvas id="pdfCanvas"></canvas>
        <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="empty">
        <div class="box">
          <h2>Abre un plano para empezar</h2>
          <p>Arrastra un PDF aquí o usa el botón. Tus planos se procesan en este equipo y no se suben a ningún servidor.</p>
          <button class="primary" id="btnOpen2">Abrir plano PDF</button>
        </div>
      </div>
    </div>
    <div id="bottom">
      <div id="tabs">
        <button data-tab="detail" class="on">Detalle</button>
        <button data-tab="summary">Resumen / despiece</button>
        <span class="sp"></span>
        <select id="expLang" title="Idioma de la exportación"><option value="en">Export in English</option><option value="es">Exportar en español</option></select>
        <button id="btnCopy" title="Copiar la tabla para pegar en Excel">Copiar para Excel</button>
        <button id="btnCsv">Exportar CSV</button>
        <button id="btnXlsx" class="primary">Exportar Excel</button>
      </div>
      <div id="tableWrap"></div>
    </div>
  </main>

  <footer>
    <span id="stTool">Herramienta: <b>Seleccionar</b></span>
    <span id="stScale">Escala: <b class="nocal">sin calibrar</b></span>
    <span id="stLive"></span>
    <span style="flex:1"></span>
    <span id="stHint"></span>
  </footer>
</div>

<div id="modalBg"><div id="modal"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- PDF.js setup ---------- */
const pdfjs = window.pdfjsLib;
pdfjs.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
let workerReady = Promise.resolve();
if (location.protocol === 'file:') {
  // Browsers block Web Workers on file://, so load the worker in the page (pdf.js uses it directly).
  workerReady = new Promise(res => { const s = document.createElement('script'); s.src = 'lib/pdf.worker.min.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); });
}

/* ---------- State ---------- */
const $ = s => document.querySelector(s);
const S = {
  pdf: null, fileName: '', pageNum: 1, numPages: 0, zoom: 1, pageW: 0, pageH: 0,
  tool: 'select', units: 'imperial',
  pages: {},        // page -> {cal: base units per PDF point, calLabel}
  items: [],        // measurements + annotations
  conditions: [],
  activeCond: null, selected: null, draft: null, openCount: null,
  undo: [], redo: [], tab: 'detail', cursor: null
};
let uid = Date.now() % 100000;
const newId = p => p + (uid++).toString(36);

const U = () => S.units === 'imperial'
  ? { len: 'ft', area: 'ft²', size: 'in', sizeToBase: 1 / 12, perM: 3.28084, wt: 'lb' }
  : { len: 'm', area: 'm²', size: 'mm', sizeToBase: 1 / 1000, perM: 1, wt: 'kg' };

/* ---------- Conditions (takeoff items) ---------- */
function presetConditions() {
  // Typical US mechanical / plumbing takeoff items (names in US trade terms)
  const imp = S.units === 'imperial';
  const L = ft => imp ? ft : +(ft * 0.3048).toFixed(2);
  const D = inch => imp ? inch : Math.round(inch * 25.4);
  const c = (o) => Object.assign({ id: newId('c'), type: 'linear', color: '#d9480f', system: '', material: '', size: '', shape: 'none', w: 0, h: 0, d: 0, gauge: 'auto', piece: 0, hanger: 0, waste: 0, price: 0 }, o);
  return [
    c({ name: 'Supply Duct 24x12', type: 'linear', color: '#e8590c', system: 'HVAC Supply', material: 'Galvanized steel', shape: 'rect', w: D(24), h: D(12), piece: L(5), hanger: L(8), waste: 10 }),
    c({ name: 'Return Duct 20x10', type: 'linear', color: '#1971c2', system: 'HVAC Return', material: 'Galvanized steel', shape: 'rect', w: D(20), h: D(10), piece: L(5), hanger: L(8), waste: 10 }),
    c({ name: 'Round Duct 10"', type: 'linear', color: '#1c7ed6', system: 'HVAC Supply', material: 'Galvanized spiral', shape: 'round', d: D(10), piece: L(10), hanger: L(10), waste: 10 }),
    c({ name: 'Flex Duct 8"', type: 'linear', color: '#74c0fc', system: 'HVAC Supply', material: 'Insulated flex R-6', size: '8"', piece: L(25), hanger: L(5), waste: 10 }),
    c({ name: 'Copper Type L 3/4"', type: 'linear', color: '#c2255c', system: 'Domestic Cold Water', material: 'Copper Type L', size: '3/4"', piece: L(20), hanger: L(6), waste: 5 }),
    c({ name: 'Copper Type L 1/2" HW', type: 'linear', color: '#e64980', system: 'Domestic Hot Water', material: 'Copper Type L', size: '1/2"', piece: L(20), hanger: L(6), waste: 5 }),
    c({ name: 'PEX 1/2"', type: 'linear', color: '#f783ac', system: 'Domestic Water', material: 'PEX-A', size: '1/2"', piece: L(100), hanger: L(2.67), waste: 5 }),
    c({ name: 'Black Steel 2" Sch 40', type: 'linear', color: '#5f3dc4', system: 'Chilled Water', material: 'Black steel Sch 40', size: '2"', piece: L(21), hanger: L(10), waste: 5 }),
    c({ name: 'PVC DWV 4"', type: 'linear', color: '#2b8a3e', system: 'Sanitary', material: 'PVC DWV Sch 40', size: '4"', piece: L(20), hanger: L(4), waste: 5 }),
    c({ name: 'Cast Iron No-Hub 4"', type: 'linear', color: '#495057', system: 'Storm', material: 'Cast iron no-hub', size: '4"', piece: L(10), hanger: L(5), waste: 5 }),
    c({ name: 'Supply Diffuser 24x24', type: 'count', color: '#f08c00', system: 'HVAC Supply', material: 'Aluminum', size: '24x24' }),
    c({ name: 'Return Grille 24x24', type: 'count', color: '#0c8599', system: 'HVAC Return', material: 'Aluminum', size: '24x24' }),
    c({ name: 'VAV Box', type: 'count', color: '#9c36b5', system: 'HVAC Supply', material: 'Terminal unit' }),
    c({ name: 'Ball Valve 3/4"', type: 'count', color: '#862e9c', system: 'Domestic Cold Water', material: 'Bronze', size: '3/4"' }),
    c({ name: 'Duct Wrap Insulation', type: 'area', color: '#0b7285', system: 'Insulation', material: 'Fiberglass 1-1/2" FSK', waste: 10 })
  ];
}
// Galvanized sheet weight, lb/ft² (incl. zinc coating)
const GA_LB = { 26: 0.906, 24: 1.156, 22: 1.406, 20: 1.656, 18: 2.156, 16: 2.656 };
// Approximate SMACNA low-pressure (up to 2" w.g.) gauge by largest dimension, inches
function autoGauge(c) {
  const k = S.units === 'imperial' ? 1 : 1 / 25.4;
  if (c.shape === 'rect') { const m = Math.max(+c.w || 0, +c.h || 0) * k; return m <= 12 ? 26 : m <= 30 ? 24 : m <= 54 ? 22 : m <= 84 ? 20 : 18; }
  if (c.shape === 'round') { const m = (+c.d || 0) * k; return m <= 14 ? 26 : m <= 26 ? 24 : m <= 36 ? 22 : m <= 50 ? 20 : 18; }
  return '';
}
const gaugeOf = c => !c || c.shape === 'none' || !c.shape ? '' : (c.gauge && c.gauge !== 'auto') ? +c.gauge : autoGauge(c);
const condById = id => S.conditions.find(c => c.id === id);
const sizeLabel = c => c.size || (c.shape === 'rect' ? `${c.w}x${c.h}` : c.shape === 'round' ? `Ø${c.d}` : '');
const typeName = { linear: 'Lineal', area: 'Área', count: 'Conteo', cloud: 'Nube', text: 'Texto' };

/* ---------- Geometry & quantities ---------- */
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const polyLen = pts => pts.reduce((s, p, i) => i ? s + dist(pts[i - 1], p) : 0, 0);
const polyArea = pts => Math.abs(pts.reduce((s, p, i) => { const q = pts[(i + 1) % pts.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2;
const centroid = pts => pts.reduce((a, p) => [a[0] + p[0] / pts.length, a[1] + p[1] / pts.length], [0, 0]);
const cal = page => (S.pages[page] && S.pages[page].cal) || null;

function qty(it) {
  const k = cal(it.page);
  if (it.type === 'count') return { q: it.points.length, unit: 'pza', ok: true };
  if (!k) return { q: 0, unit: it.type === 'area' ? U().area : U().len, ok: false };
  if (it.type === 'linear') return { q: polyLen(it.points) * k, unit: U().len, ok: true };
  if (it.type === 'area') return { q: polyArea(it.points) * k * k, unit: U().area, ok: true, per: polyLen([...it.points, it.points[0]]) * k };
  return { q: 0, unit: '', ok: false };
}
// Material breakdown (despiece) for one measurement
function breakdown(it) {
  const c = condById(it.cond) || {};
  const r = qty(it);
  const waste = +c.waste || 0;
  const qw = r.q * (1 + waste / 100);
  const o = { q: r.q, unit: r.unit, ok: r.ok, qw, pieces: '', sheet: '', gauge: '', weight: '', hangers: '', cost: (+c.price || 0) * qw, per: r.per };
  if (it.type === 'linear' && r.ok) {
    if (+c.piece > 0) o.pieces = Math.ceil(qw / c.piece - 1e-9);
    if (+c.hanger > 0) o.hangers = Math.ceil(r.q / c.hanger - 1e-9);
    const s = U().sizeToBase;
    let perim = 0;
    if (c.shape === 'rect') perim = 2 * ((+c.w || 0) + (+c.h || 0)) * s;
    if (c.shape === 'round') perim = Math.PI * (+c.d || 0) * s;
    if (perim) {
      o.sheet = qw * perim;
      o.gauge = gaugeOf(c);
      const lb = (S.units === 'imperial' ? o.sheet : o.sheet * 10.7639) * (GA_LB[o.gauge] || 0);
      o.weight = S.units === 'imperial' ? lb : lb * 0.45359;
    }
  }
  return o;
}
const isMeasure = it => it.type === 'linear' || it.type === 'area' || it.type === 'count';

/* ---------- Formatting ---------- */
const nf = (v, d = 2) => (v === '' || v == null) ? '' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
function ftIn(ft) {
  const neg = ft < 0; ft = Math.abs(ft);
  let f = Math.floor(ft), i = Math.round((ft - f) * 12 * 4) / 4;
  if (i >= 12) { f += 1; i -= 12; }
  return (neg ? '-' : '') + `${f}'-${String(i).replace('.25', '¼').replace('.5', '½').replace('.75', '¾')}"`;
}
function fmtLen(v) { return S.units === 'imperial' ? ftIn(v) : nf(v, 2) + ' m'; }
function fmtQty(b) {
  if (!b.ok) return '—';
  if (b.unit === 'pza') return String(b.q);
  if (b.unit === U().len) return fmtLen(b.q);
  return nf(b.q, 2) + ' ' + b.unit;
}

/* ---------- Scales ---------- */
const PT_PER_IN = 72;
function scaleOptions() {
  const arch = [['1/16"=1\'-0"', 1 / 16], ['3/32"=1\'-0"', 3 / 32], ['1/8"=1\'-0"', 1 / 8], ['3/16"=1\'-0"', 3 / 16], ['1/4"=1\'-0"', 1 / 4], ['3/8"=1\'-0"', 3 / 8], ['1/2"=1\'-0"', 1 / 2], ['3/4"=1\'-0"', 3 / 4], ['1"=1\'-0"', 1], ['1 1/2"=1\'-0"', 1.5], ['3"=1\'-0"', 3]];
  const eng = [10, 20, 30, 40, 50, 60, 100];
  const met = [10, 20, 25, 50, 75, 100, 125, 200, 250, 500, 1000];
  const toBaseFromFt = ft => S.units === 'imperial' ? ft : ft * 0.3048;
  const toBaseFromM = m => S.units === 'imperial' ? m * 3.28084 : m;
  const o = [];
  arch.forEach(([l, inPerFt]) => o.push({ g: 'Arquitectónica', label: l, k: toBaseFromFt(1 / (PT_PER_IN * inPerFt)) }));
  eng.forEach(n => o.push({ g: 'Ingeniería', label: `1"=${n}'`, k: toBaseFromFt(n / PT_PER_IN) }));
  met.forEach(n => o.push({ g: 'Métrica', label: `1:${n}`, k: toBaseFromM(n * 0.0254 / PT_PER_IN) }));
  return o;
}
function renderScaleSel() {
  const sel = $('#scaleSel');
  const p = S.pages[S.pageNum];
  const opts = scaleOptions();
  let html = `<option value="">Escala…</option>`;
  if (p && p.cal) html = `<option value="cur" selected>Actual: ${esc(p.calLabel || 'calibrada')}</option>` + html;
  let g = '';
  opts.forEach((o, i) => { if (o.g !== g) { if (g) html += '</optgroup>'; html += `<optgroup label="${o.g}">`; g = o.g; } html += `<option value="${i}">${esc(o.label)}</option>`; });
  html += '</optgroup><option value="calib">Calibrar con una cota…</option>';
  sel.innerHTML = html;
  sel.disabled = !S.pdf;
}
$('#scaleSel').addEventListener('change', e => {
  const v = e.target.value;
  if (v === 'calib') { setTool('calibrate'); renderScaleSel(); return; }
  if (v === '' || v === 'cur') return;
  const o = scaleOptions()[+v];
  askApplyScale(o.k, o.label);
});

/* ---------- Undo / persistence ---------- */

/* ---------- PDF loading & rendering ---------- */
async function openPdf(file) {

    S.pdf = pdf; S.numPages = pdf.numPages; S.pageNum = 1;
    const sameProject = S.fileName === file.name && S.items.length;
    S.fileName = file.name;
    let restored = false;
    if (!sameProject) {
      S.items = []; S.pages = {}; S.undo = []; S.redo = [];
      try { const saved = localStorage.getItem('smarttakeoff:' + file.name); if (saved) { loadProjectData(JSON.parse(saved)); restored = true; } } catch (e) { }
      if (!S.conditions.length) { S.conditions = presetConditions(); S.activeCond = S.conditions[0].id; }
    }
    $('#empty').hidden = true; $('#stage').hidden = false;
    document.title = file.name + ' · SmartTakeoff';
    await gotoPage(1, true);
    toast(restored ? 'Se restauró el takeoff guardado de este plano' : `${file.name} · ${S.numPages} página(s)`);
  } catch (e) {
    console.error(e); toast('No se pudo abrir el PDF: ' + e.message);
  }
}
let renderTask = null, curPage = null;
async function gotoPage(n, fit) {
  if (!S.pdf) return;
  n = Math.max(1, Math.min(S.numPages, n));
  finishDraft(); S.openCount = null;
  S.pageNum = n; S.selected = null;
  curPage = await S.pdf.getPage(n);
  const vp = curPage.getViewport({ scale: 1 });
  S.pageW = vp.width; S.pageH = vp.height;
  if (fit) fitZoom(); else await render();
  refresh();
}
function fitZoom() {
  const v = $('#viewer');
  S.zoom = Math.max(0.1, Math.min((v.clientWidth - 48) / S.pageW, (v.clientHeight - 48) / S.pageH));
  render();
}
async function render() {
  if (!curPage) return;
  const dpr = window.devicePixelRatio || 1;
  const cv = $('#pdfCanvas');
  const w = S.pageW * S.zoom, h = S.pageH * S.zoom;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const ov = $('#overlay');
  ov.setAttribute('width', w); ov.setAttribute('height', h);
  ov.setAttribute('viewBox', `0 0 ${S.pageW} ${S.pageH}`);
  $('#zoomLbl').textContent = Math.round(S.zoom * 100) + '%';
  drawOverlay();
  if (renderTask) { try { renderTask.cancel(); } catch (e) { } }
  // cap canvas size to keep memory reasonable on big sheets
  const scale = Math.min(S.zoom * dpr, Math.sqrt(16e6 / (S.pageW * S.pageH)));
  const vp = curPage.getViewport({ scale });
  const off = document.createElement('canvas');
  off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
  renderTask = curPage.render({ canvasContext: off.getContext('2d'), viewport: vp });
  try {
    await renderTask.promise;
    cv.width = off.width; cv.height = off.height;
    cv.getContext('2d').drawImage(off, 0, 0);
  } catch (e) { if (e && e.name !== 'RenderingCancelledException') console.error(e); }
}
function setZoom(z, clientX, clientY) {
  const v = $('#viewer'), st = $('#stage');
  z = Math.max(0.05, Math.min(8, z));
  const r = v.getBoundingClientRect();
  if (clientX == null) { clientX = r.left + v.clientWidth / 2; clientY = r.top + v.clientHeight / 2; }
  const sr = st.getBoundingClientRect();
  const px = (clientX - sr.left) / S.zoom, py = (clientY - sr.top) / S.zoom;
  S.zoom = z;
  render();
  v.scrollLeft = st.offsetLeft + px * z - (clientX - r.left);
  v.scrollTop = st.offsetTop + py * z - (clientY - r.top);
}

/* ---------- Overlay drawing ---------- */
const NS = 'http://www.w3.org/2000/svg';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function cloudPath(a, b) {
  const x1 = Math.min(a[0], b[0]), y1 = Math.min(a[1], b[1]), x2 = Math.max(a[0], b[0]), y2 = Math.max(a[1], b[1]);
  const pts = [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
  const arc = Math.max(6, Math.min(x2 - x1, y2 - y1) / 6);
  let d = `M${x1},${y1}`;
  for (let i = 0; i < 4; i++) {
    const p = pts[i], q = pts[(i + 1) % 4], L = dist(p, q), n = Math.max(1, Math.round(L / arc));
    for (let j = 1; j <= n; j++) {
      const x = p[0] + (q[0] - p[0]) * j / n, y = p[1] + (q[1] - p[1]) * j / n;
      const r = L / n / 2;
      d += ` A${r},${r} 0 0 1 ${x},${y}`;
    }
  }
  return d + 'Z';
}
function drawOverlay() {
  const z = S.zoom, fs = 12 / z, r = 6 / z;
  let h = '';
  const items = S.items.filter(it => it.page === S.pageNum);
  for (const it of items) {
    const c = condById(it.cond);
    const col = c ? c.color : '#e03131';
    const sel = S.selected === it.id;
    const sw = sel ? 4 : 2.5;
    const dash = sel ? 'stroke-dasharray="6 3"' : '';
    const P = it.points.map(p => p.join(',')).join(' ');
    if (it.type === 'linear') {
      h += `<g data-id="${it.id}"><polyline points="${P}" fill="none" stroke="transparent" stroke-width="14" vector-effect="non-scaling-stroke"/>`;
      h += `<polyline points="${P}" fill="none" stroke="${col}" stroke-width="${sw}" ${dash} stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".9"/>`;
      const last = it.points[it.points.length - 1];
      h += `<text x="${last[0] + r}" y="${last[1] - r}" font-size="${fs}" fill="${col}">${esc(fmtQty(breakdown(it)))}</text></g>`;
    } else if (it.type === 'area') {
      h += `<g data-id="${it.id}"><polygon points="${P}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="${sw}" ${dash} vector-effect="non-scaling-stroke"/>`;
      const [cx, cy] = centroid(it.points);
      h += `<text x="${cx}" y="${cy}" font-size="${fs}" fill="${col}" text-anchor="middle">${esc(fmtQty(breakdown(it)))}</text></g>`;
    } else if (it.type === 'count') {
      h += `<g data-id="${it.id}">`;
      it.points.forEach((p, i) => {
        h += `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${col}" fill-opacity=".85" stroke="${sel ? '#000' : '#fff'}" stroke-width="${sel ? 2 : 1.5}" vector-effect="non-scaling-stroke"/>`;
        h += `<text x="${p[0] + r * 1.3}" y="${p[1] - r * .6}" font-size="${fs * .85}" fill="${col}">${i + 1}</text>`;
      });
      h += '</g>';
    } else if (it.type === 'cloud') {
      h += `<g data-id="${it.id}"><path d="${cloudPath(it.points[0], it.points[1])}" fill="#e03131" fill-opacity=".04" stroke="#e03131" stroke-width="${sw}" ${dash} vector-effect="non-scaling-stroke"/></g>`;
    } else if (it.type === 'text') {
      const p = it.points[0];
      h += `<g data-id="${it.id}"><text x="${p[0]}" y="${p[1]}" font-size="${fs * 1.3}" fill="#e03131" font-weight="600" ${sel ? 'text-decoration="underline"' : ''}>${esc(it.text)}</text></g>`;
    }
    if (sel && (it.type === 'linear' || it.type === 'area' || it.type === 'cloud')) {
      it.points.forEach((p, i) => h += `<rect data-handle="${i}" data-hid="${it.id}" x="${p[0] - r * .7}" y="${p[1] - r * .7}" width="${r * 1.4}" height="${r * 1.4}" fill="#fff" stroke="#000" stroke-width="1.5" vector-effect="non-scaling-stroke" style="cursor:move"/>`);
    }
  }
  // draft (in-progress measurement)
  const d = S.draft;
  if (d && S.cursor) {
    const pts = [...d.points, S.cursor];
    const c = condById(d.cond);
    const col = d.type === 'calibrate' ? '#e03131' : d.type === 'cloud' ? '#e03131' : (c ? c.color : '#e03131');
    const P = pts.map(p => p.join(',')).join(' ');
    if (d.type === 'area') h += `<polygon points="${P}" fill="${col}" fill-opacity=".15" stroke="${col}" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`;
    else if (d.type === 'cloud') h += `<path d="${cloudPath(pts[0], pts[1])}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`;
    else h += `<polyline points="${P}" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`;
    pts.forEach(p => h += `<circle cx="${p[0]}" cy="${p[1]}" r="${r * .5}" fill="${col}"/>`);
  }
  $('#overlay').innerHTML = h;
}

/* ---------- Tools & mouse ---------- */
const hints = {

  calibrate: 'Clic en los dos extremos de una cota conocida',
  linear: 'Clic para agregar puntos · doble clic o Enter para terminar · Shift = ortogonal · Esc cancela',
  area: 'Clic en cada vértice · doble clic o Enter para cerrar · Shift = ortogonal · Esc cancela',
  count: 'Clic en cada elemento para contarlo · Enter o Esc para terminar el grupo',
  cloud: 'Clic en dos esquinas opuestas',
  text: 'Clic donde quieres la nota'
};
function setTool(t) {
  finishDraft(); S.openCount = null;
  if (['linear', 'area', 'count'].includes(t)) {
    const c = condById(S.activeCond);
    if (!c || c.type !== t) {
      const m = S.conditions.find(x => x.type === t);

    }

  $('#stTool').innerHTML = 'Herramienta: <b>' + esc($(`.tool[data-tool="${t}"]`).firstChild.textContent) + '</b>' + (['linear', 'area', 'count'].includes(t) ? ' · ' + esc(condById(S.activeCond).name) : '');

function evtPt(e) {

}
function ortho(p, prev) {
  const dx = p[0] - prev[0], dy = p[1] - prev[1];
  const ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
  const L = Math.hypot(dx, dy);
  return [prev[0] + Math.cos(ang) * L, prev[1] + Math.sin(ang) * L];
}
const ov = $('#overlay');
let pan = null, drag = null, spaceDown = false;
ov.addEventListener('mousedown', e => {
  if (!S.pdf) return;
  if (e.button === 1 || spaceDown || (S.tool === 'select' && e.button === 0 && !e.target.closest('[data-id]') && !e.target.dataset.handle)) {
    const v = $('#viewer');
    pan = { x: e.clientX, y: e.clientY, sl: v.scrollLeft, st: v.scrollTop, moved: false };
    ov.style.cursor = 'grabbing'; e.preventDefault(); return;
  }
  if (S.tool === 'select' && e.button === 0) {
    if (e.target.dataset.handle) {
      pushUndo();
      drag = { id: e.target.dataset.hid, i: +e.target.dataset.handle };
      e.preventDefault(); return;
    }
    const g = e.target.closest('[data-id]');
    if (g) select(g.dataset.id);
  }
});
window.addEventListener('mousemove', e => {
  if (pan) {
    const v = $('#viewer');
    v.scrollLeft = pan.sl - (e.clientX - pan.x); v.scrollTop = pan.st - (e.clientY - pan.y);
    if (Math.abs(e.clientX - pan.x) + Math.abs(e.clientY - pan.y) > 3) pan.moved = true;
    return;
  }
  if (drag) {
    const it = S.items.find(x => x.id === drag.id);
    if (it) { it.points[drag.i] = evtPt(e); drawOverlay(); }
    return;
  }
  if (!S.pdf || e.target.closest('#overlay') == null && !S.draft) return;
  let p = evtPt(e);
  if (S.draft && S.draft.points.length && e.shiftKey && S.draft.type !== 'cloud') p = ortho(p, S.draft.points[S.draft.points.length - 1]);
  S.cursor = p;
  if (S.draft) { drawOverlay(); liveReadout(); }
});
window.addEventListener('mouseup', () => {
  if (pan) { if (!pan.moved && S.tool === 'select') select(null); pan = null; ov.style.cursor = S.tool === 'select' ? 'grab' : 'crosshair'; }
  if (drag) { drag = null; refresh(); }
});
ov.addEventListener('click', e => {
  if (!S.pdf || S.tool === 'select' || e.button !== 0 || spaceDown) return;
  let p = evtPt(e);
  const t = S.tool;
  if (e.detail >= 2) { if (t === 'linear' || t === 'area') finishDraft(); return; }
  if (t === 'count') { addCount(p); return; }
  if (t === 'text') { addText(p); return; }
  if (!S.draft) S.draft = { type: t, cond: S.activeCond, points: [] };
  const d = S.draft;
  if (d.points.length && e.shiftKey && t !== 'cloud') p = ortho(p, d.points[d.points.length - 1]);
  d.points.push(p);
  if ((t === 'calibrate' || t === 'cloud') && d.points.length === 2) finishDraft();
  drawOverlay();
});
ov.addEventListener('mouseleave', () => { S.cursor = null; drawOverlay(); });
$('#viewer').addEventListener('wheel', e => {
  if (!S.pdf) return;
  if (e.ctrlKey || e.metaKey || !e.shiftKey) {
    e.preventDefault();
    setZoom(S.zoom * Math.pow(1.0015, -e.deltaY), e.clientX, e.clientY);
  }
}, { passive: false });

function liveReadout() {
  const d = S.draft;
  if (!d || !S.cursor) { $('#stLive').textContent = ''; return; }
  const pts = [...d.points, S.cursor];
  const k = cal(S.pageNum);
  let txt = '';
  if (d.type === 'linear' || d.type === 'calibrate') {

    txt = k ? 'Longitud: ' + fmtLen(L * k) : `Longitud: ${nf(L, 1)} pt (sin escala)`;

}

  const it = { id: newId('m'), page: S.pageNum, type: d.type, points: d.points };
  if (d.type !== 'cloud') it.cond = d.cond;

}

    { t: 'Cancelar' },
    { t: 'Agregar', primary: true, f: () => { const v = $('#mText').value.trim(); if (!v) return; pushUndo(); S.items.push({ id: newId('m'), page: S.pageNum, type: 'text', points: [p], text: v }); refresh(); } }

function calibrateDialog(dpt) {

}
window.addEventListener('keydown', e => {
  if ($('#modalBg').style.display === 'flex') {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter') { const b = $('#modal .primary'); if (b) b.click(); }
    return;
  }
  if (e.target.matches('input,select,textarea')) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); saveProject(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ') { spaceDown = true; ov.style.cursor = 'grab'; e.preventDefault(); return; }
  if (e.key === 'Escape') { S.draft = null; S.openCount = null; $('#stLive').textContent = ''; if (S.tool !== 'select') setTool('select'); else select(null); return; }

  if (e.key === 'PageDown') { gotoPage(S.pageNum + 1); return; }
  if (e.key === 'PageUp') { gotoPage(S.pageNum - 1); return; }
  if (e.key === '+' || e.key === '=') { setZoom(S.zoom * 1.25); return; }
  if (e.key === '-') { setZoom(S.zoom / 1.25); return; }
  const map = { v: 'select', k: 'calibrate', l: 'linear', a: 'area', c: 'count', r: 'cloud', t: 'text' };

/* ---------- Conditions panel ---------- */

  return t;
}

    let n = 0; pushUndo();
    rows.forEach(r => {
      const name = String(pick(r, /^(nombre|condici|name|item|descrip)/i)).trim(); if (!name) return;
      const forma = String(pick(r, /^forma|shape/i));
      const c = { id: newId('c'), name, type: tmap(String(pick(r, /^tipo|type/i))), color: /^#[0-9a-f]{6}$/i.test(pick(r, /^color/i)) ? pick(r, /^color/i) : '#' + Math.floor(Math.random() * 0xaaaaaa).toString(16).padStart(6, '0'),
        system: String(pick(r, /^sistema|system/i)), material: String(pick(r, /^material/i)), size: String(pick(r, /^tama|size/i)),
        shape: /rect/i.test(forma) ? 'rect' : /redond|round/i.test(forma) ? 'round' : 'none',
        gauge: String(pick(r, /^calibre|gauge/i) || 'auto'), w: +pick(r, /^ancho|width/i) || 0, h: +pick(r, /^alto|height/i) || 0, d: +pick(r, /^di[aá]m/i) || 0,
        piece: +pick(r, /^largo pieza|piece/i) || 0, hanger: +pick(r, /^soporte|hanger/i) || 0, waste: +pick(r, /^desperd|waste/i) || 0, price: +pick(r, /^precio|price|costo unit/i) || 0 };
      if (!/^(auto|16|18|20|22|24|26)$/.test(c.gauge)) c.gauge = 'auto';
      const ex = S.conditions.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (ex) Object.assign(ex, c, { id: ex.id, type: ex.type }); else S.conditions.push(c);
      n++;
    });
    refresh(); toast(n ? `${n} condición(es) importadas o actualizadas` : 'No encontré filas con columna “Nombre”');
  } catch (err) { console.error(err); toast('No se pudo leer el archivo: ' + err.message); }
});

/* ---------- Project save/load ---------- */
function saveProject() {
  if (!S.fileName) { toast('Abre un plano primero'); return; }
  download(new Blob([JSON.stringify(projectData(), null, 1)], { type: 'application/json' }), baseName() + '.takeoff.json');
}
$('#btnSave').addEventListener('click', saveProject);
$('#btnLoad').addEventListener('click', () => $('#fileJson').click());
$('#fileJson').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    loadProjectData(o); S.fileName = o.fileName || S.fileName; S.undo = []; S.redo = [];
    refresh();
    toast(S.pdf ? 'Proyecto cargado' : `Proyecto cargado. Ahora abre el plano “${o.fileName}”.`);
  } catch (err) { toast('No se pudo abrir el proyecto: ' + err.message); }
});

/* ---------- Modal & toast ---------- */
function modal(html, buttons, onCancel) {
  $('#modal').innerHTML = html + '<div class="actions"></div>';
  const act = $('#modal .actions');
  buttons.forEach(b => {
    const el = document.createElement('button'); el.textContent = b.t;
    if (b.primary) el.className = 'primary';
    if (b.danger) { el.style.color = 'var(--danger)'; el.style.marginRight = 'auto'; }
    el.addEventListener('click', () => { if (b.f && b.f() === false) return; closeModal(!b.f); if (!b.f && onCancel) onCancel(); });
    act.appendChild(el);
  });
  $('#modalBg').style.display = 'flex';
  const f = $('#modal [autofocus]') || $('#modal input'); if (f) setTimeout(() => f.focus(), 30);
}
function closeModal() { $('#modalBg').style.display = 'none'; $('#modal').innerHTML = ''; confirmDelete = false; }
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

const ATTRS = ['title', 'placeholder', 'label'];
function trNode(n) {

    if (n.__out !== n.data) n.__es = n.data;              // new or changed by the app: remember the Spanish source
