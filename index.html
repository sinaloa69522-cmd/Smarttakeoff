<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartTakeoff</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9480f">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="lib/pdf.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2330; --muted:#677084; --line:#dde1e8;
  --accent:#d9480f; --accent-ink:#fff; --hover:#eef1f5; --sel:#fff4e6; --viewer:#c9ced8;
  --danger:#c92a2a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181e; --panel:#1d2129; --ink:#e7eaf0; --muted:#98a1b3; --line:#2f3542;
    --accent:#ff7a3d; --accent-ink:#15181e; --hover:#262b35; --sel:#3a2a1d; --viewer:#0f1115; --danger:#ff6b6b;
  }
}
:root[data-theme="dark"]{
  --bg:#15181e; --panel:#1d2129; --ink:#e7eaf0; --muted:#98a1b3; --line:#2f3542;
  --accent:#ff7a3d; --accent-ink:#15181e; --hover:#262b35; --sel:#3a2a1d; --viewer:#0f1115; --danger:#ff6b6b;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{background:var(--hover)}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
#app{display:grid;height:100vh;grid-template-rows:auto 1fr auto;grid-template-columns:270px 1fr}
header{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:700;letter-spacing:.2px;margin-right:6px}
header .brand span{color:var(--accent)}
.grp{display:flex;gap:3px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.tool kbd,#btnSnap kbd{font-size:10px;opacity:.6;margin-left:3px}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h3{margin:0;padding:10px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
#condList{overflow:auto;flex:1;padding:0 6px 6px}
.cond{display:flex;align-items:center;gap:7px;padding:6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.cond:hover{background:var(--hover)}
.cond.active{background:var(--sel);border-color:var(--accent)}
.cond .sw{width:12px;height:12px;border-radius:3px;flex:none}
.cond .nm{flex:1;min-width:0}
.cond .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cond .nm small{color:var(--muted)}
.cond .q{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;text-align:right}
.cond .ed{visibility:hidden;padding:1px 6px}
.cond .eye{padding:0 5px;border:0;background:transparent;color:var(--muted);font-size:11px}
.cond .eye.off{color:var(--line)}
.cond.hid .nm{opacity:.5}
.cond:hover .ed{visibility:visible}
#pageList{max-height:30vh;overflow:auto;padding:0 6px 8px;display:flex;flex-direction:column;gap:3px}
#pageList .sheet{display:grid;grid-template-columns:1fr auto;text-align:left;padding:4px 8px}
#pageList .sheet b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pageList .sheet small{grid-column:1;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pageList .sheet.on small{color:inherit;opacity:.85}
#pageList .sheet .cnt{grid-row:1/3;grid-column:2;align-self:center;font-size:11px;background:var(--hover);color:var(--ink);border-radius:9px;padding:0 6px}
#pageList .sheet.missing{opacity:.55;border-style:dashed}
main{display:grid;grid-template-rows:1fr 6px var(--bottomH,260px);grid-template-columns:minmax(0,1fr);min-height:0;min-width:0}
#viewer{position:relative;overflow:auto;background:var(--viewer);min-height:0}
#tradeSel{margin:0 10px 6px;width:calc(100% - 20px)}
.trh{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 6px 2px;font-weight:600}
#pageList .sheet .disc{font-weight:500;font-size:10px;background:var(--hover);color:var(--muted);border-radius:8px;padding:0 5px;margin-left:5px}
#findBar{position:sticky;top:0;left:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:2px solid #7048e8}
#findBar label{display:flex;gap:4px;align-items:center}
#cmpBar{position:sticky;top:0;left:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#cmpBar .lg{display:flex;align-items:center;gap:4px;color:var(--muted)}
#cmpBar .lg i{width:12px;height:12px;border-radius:2px;display:inline-block}
#stage{position:relative;margin:24px;display:inline-block;box-shadow:0 2px 12px rgba(0,0,0,.25);background:#fff}
#pdfCanvas{display:block}
#overlay{position:absolute;left:0;top:0;user-select:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--ink);text-align:center;padding:16px}
#empty .box{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:28px 34px;max-width:460px}
#empty h2{margin:0 0 6px;font-size:18px}
#empty p{margin:0 0 14px;color:var(--muted)}
#viewer.drag #empty .box{border-color:var(--accent)}
#split{cursor:row-resize;background:var(--line)}
#split:hover{background:var(--accent)}
#bottom{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
#tabs .sp{flex:1}
#tableWrap{overflow:auto;flex:1}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);z-index:1}
td.n,th.n{text-align:right}
tr.sel td{background:var(--sel)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
footer{grid-column:1/3;display:flex;gap:14px;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer b{color:var(--ink);font-weight:600}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
#modal{background:var(--panel);border-radius:10px;padding:16px 18px;min-width:320px;max-width:560px;width:calc(100% - 32px);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#modal h3{margin:0 0 12px;font-size:15px}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;align-items:center}
.form label{color:var(--muted)}
.form input,.form select{width:100%}
.form .row2{display:flex;gap:6px}
.form .hint{grid-column:1/3;color:var(--muted);font-size:12px;margin-top:-2px}
.asmRow{display:grid;grid-template-columns:minmax(0,2.2fr) 60px minmax(0,1.6fr) 52px 70px 60px auto;gap:5px;margin-bottom:5px}
.asmRow input,.asmRow select{min-width:0}
.asmHdr{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.est{display:flex;flex-wrap:wrap;gap:18px;padding:10px 12px;align-items:flex-start}
.estCol{display:flex;flex-direction:column;gap:8px;min-width:280px}
.estForm{grid-template-columns:180px 90px}
.estBtns{display:flex;gap:6px;flex-wrap:wrap}
.estTot{width:auto;min-width:300px}
.estTot td{white-space:nowrap}
.estTot tr.sub td{font-weight:600;border-top:2px solid var(--line)}
.estTot tr.grand td{font-weight:700;font-size:15px;border-top:2px solid var(--ink);color:var(--accent)}
.estSys{width:auto;min-width:420px}
textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw}
#toast.show{opacity:.95}
.nocal{color:var(--danger);font-weight:600}
svg text{font-family:system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Smart<span>Takeoff</span></div>
    <div class="grp">
      <button id="btnOpen" title="Abrir plano PDF">Abrir PDF</button>
      <input id="filePdf" type="file" accept="application/pdf,.pdf" hidden>
      <button id="btnSave" title="Guardar el proyecto con sus planos en un archivo .takeoff (Ctrl+S). Guárdalo en tu carpeta de OneDrive o Dropbox.">Guardar</button>
      <button id="btnLoad" title="Abrir un proyecto .takeoff">Abrir proyecto</button>
      <button id="btnPdfOut" title="Descargar los planos con todas las marcas y una leyenda">PDF con marcas</button>
      <button id="btnCompare" title="Comparar esta hoja con otra revisión del plano">Comparar revisión</button>
      <input id="fileCmp" type="file" accept="application/pdf,.pdf" hidden>
      <input id="filePhoto" type="file" accept="image/*" hidden>
      <input id="fileJson" type="file" accept=".takeoff,.json,application/json" hidden>
    </div>
    <div class="grp" id="tools">
      <button class="tool" data-tool="select" title="Seleccionar / mover (V)">Seleccionar<kbd>V</kbd></button>
      <button class="tool" data-tool="calibrate" title="Calibrar escala con una cota conocida (K)">Calibrar<kbd>K</kbd></button>
      <button class="tool" data-tool="linear" title="Medición lineal (L)">Lineal<kbd>L</kbd></button>
      <button class="tool" data-tool="area" title="Medición de área (A)">Área<kbd>A</kbd></button>
      <button class="tool" data-tool="count" title="Conteo (C)">Conteo<kbd>C</kbd></button>
      <button class="tool" data-tool="deduct" title="Deducir un hueco de un área (D)">Deducir<kbd>D</kbd></button>
      <select id="annoSel" title="Anotaciones de revisión"><option value="">Anotar…</option><option value="cloud">Nube (R)</option><option value="text">Texto (T)</option><option value="arrow">Flecha (W)</option><option value="callout">Callout (Q)</option><option value="highlight">Resaltar (H)</option><option value="stamp">Sello (M)</option><option value="photo">Foto (F)</option></select>
      <button class="tool" data-tool="symbol" title="Buscar símbolo: encierra uno y encuentra todos los iguales (B)">Buscar símbolo<kbd>B</kbd></button>
      <button id="btnDetect" title="Detectar etiquetas de equipos y accesorios en el plano y convertirlas en conteos">Detectar</button>
      <button id="btnSnap" class="on" title="Ajustar a líneas del plano y a puntos de otras mediciones (S)">Snap<kbd>S</kbd></button>
    </div>
    <div class="grp">
      <select id="scaleSel" title="Escala de la página"></select>
    </div>
    <div class="grp">
      <button id="zoomOut" title="Alejar (-)">−</button>
      <span id="zoomLbl" style="min-width:44px;text-align:center">100%</span>
      <button id="zoomIn" title="Acercar (+)">+</button>
      <button id="zoomFit" title="Ajustar a la ventana">Ajustar</button>
    </div>
    <div class="grp">
      <label for="opacity" style="color:var(--muted);font-size:12px">Marcas</label>
      <input id="opacity" type="range" min="10" max="100" value="100" title="Opacidad de las marcas" style="width:80px">
    </div>
    <div class="grp">
      <button id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <button id="redo" title="Rehacer (Ctrl+Y)">↷</button>
    </div>
    <div class="grp">
      <button id="btnInstall" class="primary" hidden title="Instalar SmartTakeoff en este equipo como una app">⤓ Instalar app</button>
    </div>
    <div class="grp">
      <select id="uiLang" title="Idioma de la app"><option value="en">English</option><option value="es">Español</option></select>
      <select id="unitsSel" title="Sistema de unidades">
        <option value="imperial">Imperial (ft, in)</option>
        <option value="metric">Métrico (m, mm)</option>
      </select>
    </div>
  </header>

  <aside>
    <h3>Condiciones <span><button id="btnLib" title="Agregar condiciones de otros oficios">Biblioteca</button> <button id="btnImportCond" title="Importar condiciones desde Excel">Importar</button> <button id="btnNewCond" class="primary" title="Nueva condición">+ Nueva</button></span></h3>
    <input id="fileCond" type="file" accept=".xlsx,.xls,.csv" hidden>
    <input id="filePrice" type="file" accept=".xlsx,.xls,.csv" hidden>
    <select id="tradeSel" title="Mostrar condiciones de"></select>
    <div id="condList"></div>
    <h3>Hojas <span><span id="pageInfo"></span> <button id="btnAddPdf" title="Agregar otro PDF al proyecto">+ PDF</button></span></h3>
    <input id="filePdf2" type="file" accept="application/pdf,.pdf" multiple hidden>
    <div id="pageList"></div>
  </aside>

  <main>
    <div id="viewer">
      <div id="cmpBar" hidden><span id="cmpTxt"></span><span class="lg"><i style="background:#e03131"></i>Solo en la versión actual</span><span class="lg"><i style="background:#1c7ed6"></i>Nuevo en la revisión</span><button id="cmpUse" class="primary">Usar la revisión en esta hoja</button><button id="cmpExit">Salir</button></div>
      <div id="findBar" hidden><span id="findTxt"></span><label><input type="checkbox" id="findRot"> Incluir girados</label><select id="findSens"><option value="0.88">Estricta</option><option value="0.8" selected>Normal</option><option value="0.72">Flexible</option></select><button id="findAll">Buscar en todas las hojas</button><select id="findCond"></select><button id="findAdd" class="primary">Agregar conteos</button><button id="findExit">Cancelar</button></div>
      <div id="stage" hidden>
        <canvas id="pdfCanvas"></canvas>
        <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="empty">
        <div class="box">
          <h2>Abre un plano para empezar</h2>
          <p>Arrastra un PDF aquí o usa el botón. Tus planos se procesan en este equipo y no se suben a ningún servidor.</p>
          <button class="primary" id="btnOpen2">Abrir plano PDF</button>
        </div>
      </div>
    </div>
    <div id="split" title="Arrastra para cambiar el tamaño"></div>
    <div id="bottom">
      <div id="tabs">
        <button data-tab="detail" class="on">Detalle</button>
        <button data-tab="summary">Resumen / despiece</button>
        <button data-tab="bom">Materiales</button>
        <button data-tab="estimate">Estimado</button>
        <span class="sp"></span>
        <select id="expLang" title="Idioma de la exportación"><option value="en">Export in English</option><option value="es">Exportar en español</option></select>
        <button id="btnCopy" title="Copiar la tabla para pegar en Excel">Copiar para Excel</button>
        <button id="btnCsv">Exportar CSV</button>
        <button id="btnXlsx" class="primary">Exportar Excel</button>
      </div>
      <div id="tableWrap"></div>
    </div>
  </main>

  <footer>
    <span id="stTool">Herramienta: <b>Seleccionar</b></span>
    <span id="stScale">Escala: <b class="nocal">sin calibrar</b></span>
    <span id="stLive"></span>
    <span style="flex:1"></span>
    <span id="stSave"></span>
    <span id="stHint"></span>
  </footer>
</div>

<div id="modalBg"><div id="modal"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- PDF.js setup ---------- */
const pdfjs = window.pdfjsLib;
pdfjs.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
let workerReady = Promise.resolve();
if (location.protocol === 'file:') {
  // Browsers block Web Workers on file://, so load the worker in the page (pdf.js uses it directly).
  workerReady = new Promise(res => { const s = document.createElement('script'); s.src = 'lib/pdf.worker.min.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); });
}

/* ---------- State ---------- */
const $ = s => document.querySelector(s);
const S = {
  pdf: null, pdfs: {}, pdfBytes: {}, sheets: [], compare: null, fileName: '', pageNum: 1, numPages: 0, snap: true, snapHit: null, zoom: 1, pageW: 0, pageH: 0,
  tool: 'select', units: 'imperial',
  pages: {},        // page -> {cal: base units per PDF point, calLabel}
  items: [],        // measurements + annotations
  conditions: [],
  activeCond: null, selected: null, draft: null, openCount: null,
  undo: [], redo: [], tab: 'detail', cursor: null
};
let uid = Date.now() % 100000;
const newId = p => p + (uid++).toString(36);

const U = () => S.units === 'imperial'
  ? { len: 'ft', area: 'ft²', size: 'in', sizeToBase: 1 / 12, perM: 3.28084, wt: 'lb' }
  : { len: 'm', area: 'm²', size: 'mm', sizeToBase: 1 / 1000, perM: 1, wt: 'kg' };

/* ---------- Conditions (takeoff items) ---------- */
function presetConditions() {
  const base = mechPlumbPresets(); base.forEach(c => { c.trade = guessTrade(c); c.ht = 0; c.th = 0; c.tags = PRESET_TAGS[c.name] || []; });
  return [...base, ...tradePresets().map(applyDefaultLabor)];
}
function mechPlumbPresets() {
  // Typical US mechanical / plumbing takeoff items (names in US trade terms)
  const imp = S.units === 'imperial';
  const L = ft => imp ? ft : +(ft * 0.3048).toFixed(2);
  const D = inch => imp ? inch : Math.round(inch * 25.4);
  const c = (o) => Object.assign({ id: newId('c'), type: 'linear', color: '#d9480f', system: '', material: '', size: '', shape: 'none', w: 0, h: 0, d: 0, gauge: 'auto', piece: 0, hanger: 0, waste: 0, price: 0, asm: [] }, o);
  const A = (name, f, base, unit) => ({ name, f, base, unit, price: 0 });
  const ductAsm = (sz, insul) => [A(`Elbow 90° ${sz}`, 1, 'el90', 'EA'), A(`Elbow 45° ${sz}`, 1, 'el45', 'EA'), A('Hanger strap 1" galv.', 2, 'hanger', 'EA'), A('Duct sealant', 0.01, 'sheet', 'GAL'), ...(insul ? [A('Duct wrap 1-1/2" FSK', 1.1, 'sheet', 'SF')] : [])];
  const pipeAsm = (sz, mat, insul) => [A(`Elbow 90° ${sz} ${mat}`, 1, 'el90', 'EA'), A(`Elbow 45° ${sz} ${mat}`, 1, 'el45', 'EA'), A(`Coupling ${sz} ${mat}`, 1, 'piece', 'EA'), A(`Clevis hanger ${sz}`, 1, 'hanger', 'EA'), A('Threaded rod 3/8"', 2, 'hanger', 'LF'), ...(insul ? [A(`Pipe insulation ${sz} x ${insul}`, 1, 'qty', 'LF')] : [])];
  return [
    c({ name: 'Supply Duct 24x12', type: 'linear', color: '#e8590c', system: 'HVAC Supply', material: 'Galvanized steel', shape: 'rect', w: D(24), h: D(12), piece: L(5), hanger: L(8), waste: 10, asm: ductAsm('24x12', true) }),
    c({ name: 'Return Duct 20x10', type: 'linear', color: '#1971c2', system: 'HVAC Return', material: 'Galvanized steel', shape: 'rect', w: D(20), h: D(10), piece: L(5), hanger: L(8), waste: 10, asm: ductAsm('20x10', false) }),
    c({ name: 'Round Duct 10"', type: 'linear', color: '#1c7ed6', system: 'HVAC Supply', material: 'Galvanized spiral', shape: 'round', d: D(10), piece: L(10), hanger: L(10), waste: 10, asm: [A('Elbow 90° 10" round', 1, 'el90', 'EA'), A('Elbow 45° 10" round', 1, 'el45', 'EA'), A('Hanger strap 1" galv.', 1, 'hanger', 'EA'), A('Duct sealant', 0.01, 'sheet', 'GAL')] }),
    c({ name: 'Flex Duct 8"', type: 'linear', color: '#74c0fc', system: 'HVAC Supply', material: 'Insulated flex R-6', size: '8"', piece: L(25), hanger: L(5), waste: 10, asm: [A('Flex duct clamp 8"', 2, 'drop', 'EA'), A('Flex duct strap', 1, 'hanger', 'EA')] }),
    c({ name: 'Copper Type L 3/4"', type: 'linear', color: '#c2255c', system: 'Domestic Cold Water', material: 'Copper Type L', size: '3/4"', piece: L(20), hanger: L(6), waste: 5, asm: pipeAsm('3/4"', 'copper', '1" fiberglass') }),

function liveReadout() {
  const d = S.draft;

  const pts = [...d.points, S.cursor];
  const k = cal(S.pageNum);
  let txt = '';
  if (d.type === 'linear' || d.type === 'calibrate') {
    const L = polyLen(pts);
    txt = k ? 'Longitud: ' + fmtLen(L * k) : `Longitud: ${nf(L, 1)} pt (sin escala)`;
  } else if ((d.type === 'area' || d.type === 'deduct') && pts.length > 2) {
    const A = polyArea(pts);
    txt = k ? `Área: ${nf(A * k * k)} ${U().area}` : `Área: ${nf(A, 0)} pt² (sin escala)`;
  }
  $('#stLive').innerHTML = txt ? '<b>' + esc(txt) + '</b>' : '';
}

function finishDraft() {
  const d = S.draft; S.draft = null; $('#stLive').textContent = '';
  if (!d) return;
  if (d.type === 'calibrate') { if (d.points.length === 2) calibrateDialog(dist(d.points[0], d.points[1])); return; }
  if (d.type === 'symbol') { if (d.points.length === 2) { S.find = null; symbolSearch(d.points, 'page'); } drawOverlay(); return; }
  const min = d.type === 'area' || d.type === 'deduct' ? 3 : 2;
  if (d.points.length < min) { drawOverlay(); return; }
  if (d.type === 'deduct') {
    const c0 = centroid(d.points);
    const host = S.items.filter(x => x.page === S.pageNum && x.type === 'area').reverse().find(x => inPoly(c0, x.points));
    if (!host) { toast('Dibuja la deducción dentro de un área medida'); drawOverlay(); return; }
    pushUndo(); (host.holes || (host.holes = [])).push(d.points); toast('Deducción restada del área'); refresh(); return;
  }
  pushUndo();
  const it = { id: newId('m'), page: S.pageNum, type: d.type, points: d.points };
  if (d.type === 'linear' || d.type === 'area') it.cond = d.cond;
  if (d.type === 'callout') {
    modal(`<h3>Callout</h3><div class="form"><label>Texto</label><input type="text" id="mText" autofocus></div>`, [{ t: 'Cancelar', f: () => drawOverlay() },
      { t: 'Agregar', primary: true, f: () => { const v = $('#mText').value.trim(); if (!v) return false; it.text = v; pushUndo(); S.items.push(it); refresh(); } }]);
    return;
  }
  S.items.push(it);
  if (isMeasure(it) && !cal(S.pageNum)) toast('Medición guardada. Calibra la escala para ver la cantidad real.');
  refresh();
}
function addCount(p) {
  pushUndo();
  let it = S.openCount && S.items.find(x => x.id === S.openCount);
  if (!it || it.page !== S.pageNum || it.cond !== S.activeCond) {
    it = { id: newId('m'), page: S.pageNum, type: 'count', cond: S.activeCond, points: [] };
    S.items.push(it); S.openCount = it.id;
  }

}

function summaryRows() {

    const r = g[c.id] || (g[c.id] = { c, q: 0, qw: 0, pieces: 0, sheet: 0, weight: 0, hangers: 0, el90: 0, el45: 0, cost: 0, hours: 0, n: 0, nocal: 0 });

// Read an image file and shrink it to a light PNG/JPEG data URL for the proposal header
function readLogo(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) { rej(new Error('Elige una imagen (PNG, JPG o SVG)')); return; }
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('No se pudo leer la imagen'));
      img.onload = () => {
        const k = Math.min(1, 600 / img.width, 240 / img.height);
        const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/png'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function compareRevision(file) {
  try {
    const sh = S.sheets[S.pageNum - 1];
    const buf = await file.arrayBuffer(); const bytes = buf.slice(0);
    const pdf = await pdfjs.getDocument({ data: buf }).promise;
    // match the sheet by its number in the title block, else by page position
    let pg = 0;
    for (let i = 1; i <= pdf.numPages && !pg; i++) { const nm = (await detectSheet(pdf, i)).name; if (nm && sh && nm === sh.name) pg = i; }
    if (!pg) pg = sh && sh.page <= pdf.numPages ? sh.page : 1;
    const np = await pdf.getPage(pg);
    const cv = $('#pdfCanvas'), W = cv.width, H = cv.height, ctx = cv.getContext('2d');
    const oldImg = ctx.getImageData(0, 0, W, H);
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const oc = off.getContext('2d'); oc.fillStyle = '#fff'; oc.fillRect(0, 0, W, H);
    await np.render({ canvasContext: oc, viewport: np.getViewport({ scale: W / np.getViewport({ scale: 1 }).width }) }).promise;
    const a = oldImg.data, b = oc.getImageData(0, 0, W, H).data, out = ctx.createImageData(W, H), o = out.data;
    const dk = (d, i) => d[i + 3] > 0 && d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11 < 170;
    let gone = 0, added = 0;
    for (let i = 0; i < a.length; i += 4) {
      const x = dk(a, i), y = dk(b, i);
      const c = x && y ? [150, 150, 150] : x ? (gone++, [224, 49, 49]) : y ? (added++, [28, 126, 214]) : [255, 255, 255];
      o[i] = c[0]; o[i + 1] = c[1]; o[i + 2] = c[2]; o[i + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
    S.compare = { name: file.name, pdf, bytes, page: pg };
    $('#cmpTxt').innerHTML = `${esc(sheetName(S.pageNum))} vs <b>${esc(file.name)}</b> p${pg}`;
    $('#cmpBar').hidden = false;
    toast(gone + added ? 'Cambios marcados en rojo y azul' : 'No encontré diferencias en esta hoja');
  } catch (err) { console.error(err); toast('No se pudo comparar: ' + err.message); }
}
function endCompare() { S.compare = null; $('#cmpBar').hidden = true; }
$('#cmpExit').addEventListener('click', () => { endCompare(); render(); });

function toMetricPreset(c) {
  const fl = 3.28084, fa = 10.7639, k = c.type === 'linear' ? fl : c.type === 'area' ? fa : 1;
  c.labor = +(c.labor * k).toFixed(4);
  c.piece = +(c.piece * 0.3048).toFixed(3); c.hanger = +(c.hanger * 0.3048).toFixed(3); c.ht = +(c.ht * 0.3048).toFixed(3); c.th = Math.round(c.th * 25.4);
  const rename = { LF: 'm', SF: 'm²', CY: 'm³' };

    const per = a.base === 'qty' ? k : a.base === 'wall' ? fa : a.base === 'perim' ? fl : 1;
    const back = a.unit === 'LF' ? fl : a.unit === 'SF' ? fa : a.unit === 'CY' && a.base !== 'vol' ? 1 / 1.30795 : 1;
    a.f = +(a.f * per / back).toPrecision(4); a.lab = +(a.lab * back).toPrecision(4);
    if (rename[a.unit]) a.unit = rename[a.unit];
  });
}

/* ---------- Detect tags on the drawing ---------- */
async function sheetTokens(n) {
  const sh = S.sheets[n - 1], doc = sh && S.pdfs[sh.doc]; if (!doc) return null;
  const pg = await doc.getPage(sh.page), vp = pg.getViewport({ scale: 1 }), tc = await pg.getTextContent();
  const out = [];
  tc.items.forEach(it => {
    const str = it.str || ''; if (!str.trim()) return;
    const [a, b, c, d, e, f] = it.transform, L = Math.hypot(a, b) || 1, h = Math.hypot(c, d) || 1;
    const re = /\S+/g; let m;
    while ((m = re.exec(str))) {
      const frac = (m.index + m[0].length / 2) / str.length, w = it.width || str.length * h * 0.5;
      const x = e + a / L * w * frac + c / h * h * 0.35, y = f + b / L * w * frac + d / h * h * 0.35;
      const [px, py] = vp.convertToViewportPoint(x, y);
      out.push({ t: m[0].replace(/[.,;:()]+$/g, '').toUpperCase(), x: px, y: py, h, x0: vp.convertToViewportPoint(e, f)[0] });
    }
  });
  return out;
}
// Drop tags that sit in a schedule column (3+ stacked, left-aligned): those are tables, not the plan
function dropScheduleTags(toks) {
  const keep = new Set(toks);
  const byPrefix = {};
  toks.forEach(t => (byPrefix[t.prefix] = byPrefix[t.prefix] || []).push(t));
  Object.values(byPrefix).forEach(list => {
    const sorted = [...list].sort((a, b) => a.x0 - b.x0);
    let i = 0;
    while (i < sorted.length) {
      let j = i; while (j + 1 < sorted.length && Math.abs(sorted[j + 1].x0 - sorted[i].x0) < 2) j++;
      const col = sorted.slice(i, j + 1).sort((a, b) => a.y - b.y);
      let run = [col[0]];
      const flush = () => { if (run.length >= 3) run.forEach(t => keep.delete(t)); };
      for (let k = 1; k < col.length; k++) { if (col[k].y - col[k - 1].y < col[k].h * 5) run.push(col[k]); else { flush(); run = [col[k]]; } }
      flush(); i = j + 1;
    }
  });
  return toks.filter(t => keep.has(t));
}
function tagIndex(trades) {
  const idx = {};
  const pool = [...S.conditions.filter(c => c.type === 'count' && (!trades || !c.trade || trades.includes(c.trade))), ...S.conditions.filter(c => c.type === 'count')];
  pool.forEach(c => (c.tags || []).forEach(t => { const k = String(t).toUpperCase().trim(); if (k && !idx[k]) idx[k] = c.id; }));
  return idx;
}
async function scanTags(scope, custom) {
  const pages = scope === 'all' ? S.sheets.map((_, i) => i + 1) : [S.pageNum];
  const sheetNames = new Set(S.sheets.map(s => String(s.name).toUpperCase()));
  const groups = {};
  const cust = (custom || '').split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
  for (const n of pages) {
    const toks = await sheetTokens(n); if (!toks) continue;
    const sh = S.sheets[n - 1], trades = sh && sh.disc && DISCS[sh.disc] ? DISCS[sh.disc] : null;
    const idx = tagIndex(trades);
    const found = [];
    toks.forEach(t => {
      if (cust.includes(t.t)) { found.push(Object.assign(t, { prefix: t.t, key: t.t })); return; }
      const m = /^([A-Z]{2,5})-?(\d{1,3}[A-Z]?)?$/.exec(t.t); if (!m) return;
      if (sheetNames.has(t.t)) return;
      const known = idx[m[1]];
      if (!known && !(m[2] && /^[A-Z]{2,5}-\d{1,2}[A-Z]?$/.test(t.t))) return;   // unknown prefixes only as TAG-N
      found.push(Object.assign(t, { prefix: m[1], key: m[1], cond: known || null, trades }));
    });
    dropScheduleTags(found).forEach(t => {
      const g = groups[t.key] || (groups[t.key] = { key: t.key, cond: t.cond || null, trades: t.trades, pts: {}, n: 0, labels: new Set() });
      (g.pts[n] = g.pts[n] || []).push([t.x, t.y]); g.n++; g.labels.add(t.t);
    });
  }
  return Object.values(groups).sort((a, b) => (!!b.cond - !!a.cond) || b.n - a.n);
}

// Add count marks per page, skipping points that already have a mark of that condition nearby
function addCountPoints(cid, ptsByPage, tol) {
  let added = 0;
  Object.entries(ptsByPage).forEach(([pg, pts]) => {
    pg = +pg;
    const existing = S.items.filter(i => i.type === 'count' && i.cond === cid && i.page === pg).flatMap(i => i.points);
    const fresh = pts.filter(p => !existing.some(q => dist(p, q) < tol));
    if (!fresh.length) return;
    S.items.push({ id: newId('m'), page: pg, type: 'count', cond: cid, points: fresh, auto: true });
    added += fresh.length;
  });
  return added;
}

  const T = new Uint8Array(W * H), D = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) { const r = y * W; for (let x = 0; x < W; x++) T[r + x] = B[r + x] | (x > 0 ? B[r + x - 1] : 0) | (x < W - 1 ? B[r + x + 1] : 0); }

}
function integral(B, W, H) {

}
// Cut the selected symbol (trimmed to its ink) out of the raster as a small binary template
function makeTemplate(R, rect) {
  const { W, B, sc } = R;
  let x0 = Math.max(0, Math.floor(Math.min(rect[0][0], rect[1][0]) * sc)), y0 = Math.max(0, Math.floor(Math.min(rect[0][1], rect[1][1]) * sc));
  let x1 = Math.min(R.W - 1, Math.ceil(Math.max(rect[0][0], rect[1][0]) * sc)), y1 = Math.min(R.H - 1, Math.ceil(Math.max(rect[0][1], rect[1][1]) * sc));

  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (B[y * W + x]) { if (x < ax) ax = x; if (y < ay) ay = y; if (x > bx) bx = x; if (y > by) by = y; }

  const tw = bx - ax + 1, th = by - ay + 1, T = new Uint8Array(tw * th);

  return { tw, th, T };
}
function rotTemplate(t) {   // 90° clockwise
  const { tw, th, T } = t, R = new Uint8Array(tw * th);

}
async function matchTemplate(R, tpls, thr, D, I) {
  const { W, H, B } = R, cands = [];
  for (const t of tpls) {
    const { tw, th, T } = t, Td = dilate(T, tw, th);
    const on = [], onD = [];
    for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) { if (T[y * tw + x]) on.push(y * W + x); if (Td[y * tw + x]) onD.push(y * W + x); }
    const n = on.length; if (n < 12) continue;
    const lo = n * 0.6, hi = n * 1.9, maxMiss = Math.floor(n * (1 - thr)), W1 = W + 1;
    for (let y = 0; y + th <= H; y++) {
      if ((y & 63) === 0) await tick();
      for (let x = 0; x + tw <= W; x++) {
        const cnt = I[(y + th) * W1 + x + tw] - I[y * W1 + x + tw] - I[(y + th) * W1 + x] + I[y * W1 + x];
        if (cnt < lo || cnt > hi) continue;
        const base = y * W + x; let miss = 0;
        for (let k = 0; k < n; k++) if (!D[base + on[k]] && ++miss > maxMiss) break;
        if (miss > maxMiss) continue;
        let hit = 0; for (let k = 0; k < onD.length; k++) hit += B[base + onD[k]];
        const prec = hit / cnt; if (prec < thr - 0.1) continue;
        cands.push([x + tw / 2, y + th / 2, (1 - miss / n + prec) / 2, tw, th]);
      }
    }
  }
  cands.sort((a, b) => b[2] - a[2]);
  const keep = [];
  for (const c of cands) if (!keep.some(k => Math.abs(k[0] - c[0]) < Math.max(k[3], c[3]) * 0.6 && Math.abs(k[1] - c[1]) < Math.max(k[4], c[4]) * 0.6)) keep.push(c);
  return keep.map(k => [k[0] / R.sc, k[1] / R.sc]);
}
async function symbolSearch(rect, scope) {
  const rw = Math.abs(rect[1][0] - rect[0][0]), rh = Math.abs(rect[1][1] - rect[0][1]);
  if (rw < 2 || rh < 2) { toast('Encierra el símbolo con un recuadro'); return; }
  const f = S.find = S.find && S.find.rect === rect ? S.find : { rect, page: S.pageNum, pts: {}, scope: 'page' };
  f.scope = scope || f.scope; f.busy = true;
  const sc = Math.max(1, Math.min(6, 40 / Math.max(rw, rh)));
  const thr = +$('#findSens').value || 0.8, rot = $('#findRot').checked;
  showFindBar('Buscando…');
  try {
    const R0 = await rasterSheet(f.page, sc);
    let tpl = makeTemplate(R0, rect);
    if (!tpl || tpl.tw * tpl.th < 30) { toast('El recuadro no tiene suficiente dibujo. Encierra el símbolo completo.'); endFind(); return; }
    const tpls = [tpl]; if (rot) { let t = tpl; for (let i = 0; i < 3; i++) { t = rotTemplate(t); tpls.push(t); } }
    const pages = f.scope === 'all' ? S.sheets.map((_, i) => i + 1).filter(n => S.pdfs[S.sheets[n - 1].doc]) : [f.page];
    f.pts = {};
    for (const n of pages) {
      showFindBar(pages.length > 1 ? `Buscando en la hoja ${pages.indexOf(n) + 1} de ${pages.length}…` : 'Buscando…');
      const R = n === f.page ? R0 : await rasterSheet(n, R0.sc);
      if (!R) continue;
      const pts = await matchTemplate(R, tpls, thr, dilate(R.B, R.W, R.H), integral(R.B, R.W, R.H));
      if (pts.length) f.pts[n] = pts;
      if (!S.find) return;   // cancelled
    }
  } catch (e) { console.error(e); toast('No se pudo buscar el símbolo: ' + e.message); }
  f.busy = false;
  showFindBar(); drawOverlay();
}
function findTotal() { return S.find ? Object.values(S.find.pts).reduce((s, a) => s + a.length, 0) : 0; }
function showFindBar(msg) {
  const f = S.find; $('#findBar').hidden = !f; if (!f) return;
  const here = (f.pts[S.pageNum] || []).length, tot = findTotal(), pages = Object.keys(f.pts).length;
  $('#findTxt').textContent = msg || (f.scope === 'all' ? `${tot} encontrados en ${pages} hoja(s) · clic en un recuadro para quitarlo` : `${here} encontrados en esta hoja · clic en un recuadro para quitarlo`);
  const conds = S.conditions.filter(c => c.type === 'count'), vis = visibleConds().filter(c => c.type === 'count');
  const cur = $('#findCond').value;
  const def = condById(cur) && cur || (condById(S.activeCond) && condById(S.activeCond).type === 'count' ? S.activeCond : (vis[0] || conds[0] || {}).id);
  $('#findCond').innerHTML = `<option value="__new">+ Nueva condición</option>` + [...vis, ...conds.filter(c => !vis.includes(c))].map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#findCond').value = def || '__new';

function endFind() { S.find = null; $('#findBar').hidden = true; drawOverlay(); }
function findOverlay() {

}
