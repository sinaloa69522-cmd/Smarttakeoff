<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartTakeoff</title>
<script src="lib/pdf.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2330; --muted:#677084; --line:#dde1e8;
  --accent:#d9480f; --accent-ink:#fff; --hover:#eef1f5; --sel:#fff4e6; --viewer:#c9ced8;
  --danger:#c92a2a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181e; --panel:#1d2129; --ink:#e7eaf0; --muted:#98a1b3; --line:#2f3542;
    --accent:#ff7a3d; --accent-ink:#15181e; --hover:#262b35; --sel:#3a2a1d; --viewer:#0f1115; --danger:#ff6b6b;
  }
}
:root[data-theme="dark"]{
  --bg:#15181e; --panel:#1d2129; --ink:#e7eaf0; --muted:#98a1b3; --line:#2f3542;
  --accent:#ff7a3d; --accent-ink:#15181e; --hover:#262b35; --sel:#3a2a1d; --viewer:#0f1115; --danger:#ff6b6b;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{background:var(--hover)}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
#app{display:grid;height:100vh;grid-template-rows:auto 1fr auto;grid-template-columns:270px 1fr}
header{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:700;letter-spacing:.2px;margin-right:6px}
header .brand span{color:var(--accent)}
.grp{display:flex;gap:3px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.tool kbd{font-size:10px;opacity:.6;margin-left:3px}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h3{margin:0;padding:10px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
#condList{overflow:auto;flex:1;padding:0 6px 6px}
.cond{display:flex;align-items:center;gap:7px;padding:6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.cond:hover{background:var(--hover)}
.cond.active{background:var(--sel);border-color:var(--accent)}
.cond .sw{width:12px;height:12px;border-radius:3px;flex:none}
.cond .nm{flex:1;min-width:0}
.cond .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cond .nm small{color:var(--muted)}
.cond .q{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;text-align:right}
.cond .ed{visibility:hidden;padding:1px 6px}
.cond:hover .ed{visibility:visible}
#pageList{max-height:28vh;overflow:auto;padding:0 6px 8px;display:flex;flex-wrap:wrap;gap:4px}
#pageList button{min-width:36px}
main{display:grid;grid-template-rows:1fr 6px var(--bottomH,260px);grid-template-columns:minmax(0,1fr);min-height:0;min-width:0}
#viewer{position:relative;overflow:auto;background:var(--viewer);min-height:0}
#stage{position:relative;margin:24px;display:inline-block;box-shadow:0 2px 12px rgba(0,0,0,.25);background:#fff}
#pdfCanvas{display:block}
#overlay{position:absolute;left:0;top:0;user-select:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--ink);text-align:center;padding:16px}
#empty .box{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:28px 34px;max-width:460px}
#empty h2{margin:0 0 6px;font-size:18px}
#empty p{margin:0 0 14px;color:var(--muted)}
#viewer.drag #empty .box{border-color:var(--accent)}
#split{cursor:row-resize;background:var(--line)}
#split:hover{background:var(--accent)}
#bottom{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
#tabs .sp{flex:1}
#tableWrap{overflow:auto;flex:1}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);z-index:1}
td.n,th.n{text-align:right}
tr.sel td{background:var(--sel)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
footer{grid-column:1/3;display:flex;gap:14px;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer b{color:var(--ink);font-weight:600}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
#modal{background:var(--panel);border-radius:10px;padding:16px 18px;min-width:320px;max-width:560px;width:calc(100% - 32px);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#modal h3{margin:0 0 12px;font-size:15px}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;align-items:center}
.form label{color:var(--muted)}
.form input,.form select{width:100%}
.form .row2{display:flex;gap:6px}
.form .hint{grid-column:1/3;color:var(--muted);font-size:12px;margin-top:-2px}
.asmRow{display:grid;grid-template-columns:minmax(0,2.2fr) 60px minmax(0,1.6fr) 52px 70px 60px auto;gap:5px;margin-bottom:5px}
.asmRow input,.asmRow select{min-width:0}
.asmHdr{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.est{display:flex;flex-wrap:wrap;gap:18px;padding:10px 12px;align-items:flex-start}
.estCol{display:flex;flex-direction:column;gap:8px;min-width:280px}
.estForm{grid-template-columns:180px 90px}
.estBtns{display:flex;gap:6px;flex-wrap:wrap}
.estTot{width:auto;min-width:300px}
.estTot td{white-space:nowrap}
.estTot tr.sub td{font-weight:600;border-top:2px solid var(--line)}
.estTot tr.grand td{font-weight:700;font-size:15px;border-top:2px solid var(--ink);color:var(--accent)}
.estSys{width:auto;min-width:420px}
textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw}
#toast.show{opacity:.95}
.nocal{color:var(--danger);font-weight:600}
svg text{font-family:system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Smart<span>Takeoff</span></div>
    <div class="grp">
      <button id="btnOpen" title="Abrir plano PDF">Abrir PDF</button>
      <input id="filePdf" type="file" accept="application/pdf,.pdf" hidden>
      <button id="btnSave" title="Guardar proyecto (.json)">Guardar</button>
      <button id="btnLoad" title="Abrir proyecto (.json)">Abrir proyecto</button>
      <input id="fileJson" type="file" accept=".json,application/json" hidden>
    </div>
    <div class="grp" id="tools">
      <button class="tool" data-tool="select" title="Seleccionar / mover (V)">Seleccionar<kbd>V</kbd></button>
      <button class="tool" data-tool="calibrate" title="Calibrar escala con una cota conocida (K)">Calibrar<kbd>K</kbd></button>
      <button class="tool" data-tool="linear" title="Medición lineal (L)">Lineal<kbd>L</kbd></button>
      <button class="tool" data-tool="area" title="Medición de área (A)">Área<kbd>A</kbd></button>
      <button class="tool" data-tool="count" title="Conteo (C)">Conteo<kbd>C</kbd></button>
      <button class="tool" data-tool="cloud" title="Nube de revisión (R)">Nube<kbd>R</kbd></button>
      <button class="tool" data-tool="text" title="Nota de texto (T)">Texto<kbd>T</kbd></button>
    </div>
    <div class="grp">
      <select id="scaleSel" title="Escala de la página"></select>
    </div>
    <div class="grp">
      <button id="zoomOut" title="Alejar (-)">−</button>
      <span id="zoomLbl" style="min-width:44px;text-align:center">100%</span>
      <button id="zoomIn" title="Acercar (+)">+</button>
      <button id="zoomFit" title="Ajustar a la ventana">Ajustar</button>
    </div>
    <div class="grp">
      <button id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <button id="redo" title="Rehacer (Ctrl+Y)">↷</button>
    </div>
    <div class="grp">
      <select id="uiLang" title="Idioma de la app"><option value="en">English</option><option value="es">Español</option></select>
      <select id="unitsSel" title="Sistema de unidades">
        <option value="imperial">Imperial (ft, in)</option>
        <option value="metric">Métrico (m, mm)</option>
      </select>
    </div>
  </header>

  <aside>
    <h3>Condiciones <span><button id="btnImportCond" title="Importar condiciones desde Excel">Importar</button> <button id="btnNewCond" class="primary" title="Nueva condición">+ Nueva</button></span></h3>
    <input id="fileCond" type="file" accept=".xlsx,.xls,.csv" hidden>
    <input id="filePrice" type="file" accept=".xlsx,.xls,.csv" hidden>
    <div id="condList"></div>
    <h3>Páginas <span id="pageInfo"></span></h3>
    <div id="pageList"></div>
  </aside>

  <main>
    <div id="viewer">
      <div id="stage" hidden>
        <canvas id="pdfCanvas"></canvas>
        <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="empty">
        <div class="box">
          <h2>Abre un plano para empezar</h2>
          <p>Arrastra un PDF aquí o usa el botón. Tus planos se procesan en este equipo y no se suben a ningún servidor.</p>
          <button class="primary" id="btnOpen2">Abrir plano PDF</button>
        </div>
      </div>
    </div>
    <div id="split" title="Arrastra para cambiar el tamaño"></div>
    <div id="bottom">
      <div id="tabs">
        <button data-tab="detail" class="on">Detalle</button>
        <button data-tab="summary">Resumen / despiece</button>
        <button data-tab="bom">Materiales</button>
        <button data-tab="estimate">Estimado</button>
        <span class="sp"></span>
        <select id="expLang" title="Idioma de la exportación"><option value="en">Export in English</option><option value="es">Exportar en español</option></select>
        <button id="btnCopy" title="Copiar la tabla para pegar en Excel">Copiar para Excel</button>
        <button id="btnCsv">Exportar CSV</button>
        <button id="btnXlsx" class="primary">Exportar Excel</button>
      </div>
      <div id="tableWrap"></div>
    </div>
  </main>

  <footer>
    <span id="stTool">Herramienta: <b>Seleccionar</b></span>
    <span id="stScale">Escala: <b class="nocal">sin calibrar</b></span>
    <span id="stLive"></span>
    <span style="flex:1"></span>
    <span id="stHint"></span>
  </footer>
</div>

<div id="modalBg"><div id="modal"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- PDF.js setup ---------- */
const pdfjs = window.pdfjsLib;
pdfjs.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
let workerReady = Promise.resolve();
if (location.protocol === 'file:') {
  // Browsers block Web Workers on file://, so load the worker in the page (pdf.js uses it directly).
  workerReady = new Promise(res => { const s = document.createElement('script'); s.src = 'lib/pdf.worker.min.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); });
}

/* ---------- State ---------- */
const $ = s => document.querySelector(s);
const S = {
  pdf: null, fileName: '', pageNum: 1, numPages: 0, zoom: 1, pageW: 0, pageH: 0,
  tool: 'select', units: 'imperial',
  pages: {},        // page -> {cal: base units per PDF point, calLabel}
  items: [],        // measurements + annotations
  conditions: [],
  activeCond: null, selected: null, draft: null, openCount: null,
  undo: [], redo: [], tab: 'detail', cursor: null
};
let uid = Date.now() % 100000;
const newId = p => p + (uid++).toString(36);

const U = () => S.units === 'imperial'
  ? { len: 'ft', area: 'ft²', size: 'in', sizeToBase: 1 / 12, perM: 3.28084, wt: 'lb' }
  : { len: 'm', area: 'm²', size: 'mm', sizeToBase: 1 / 1000, perM: 1, wt: 'kg' };

/* ---------- Conditions (takeoff items) ---------- */
function presetConditions() {
  // Typical US mechanical / plumbing takeoff items (names in US trade terms)
  const imp = S.units === 'imperial';
  const L = ft => imp ? ft : +(ft * 0.3048).toFixed(2);
  const D = inch => imp ? inch : Math.round(inch * 25.4);
  const c = (o) => Object.assign({ id: newId('c'), type: 'linear', color: '#d9480f', system: '', material: '', size: '', shape: 'none', w: 0, h: 0, d: 0, gauge: 'auto', piece: 0, hanger: 0, waste: 0, price: 0, asm: [] }, o);
  const A = (name, f, base, unit) => ({ name, f, base, unit, price: 0 });
  const ductAsm = (sz, insul) => [A(`Elbow 90° ${sz}`, 1, 'el90', 'EA'), A(`Elbow 45° ${sz}`, 1, 'el45', 'EA'), A('Hanger strap 1" galv.', 2, 'hanger', 'EA'), A('Duct sealant', 0.01, 'sheet', 'GAL'), ...(insul ? [A('Duct wrap 1-1/2" FSK', 1.1, 'sheet', 'SF')] : [])];
  const pipeAsm = (sz, mat, insul) => [A(`Elbow 90° ${sz} ${mat}`, 1, 'el90', 'EA'), A(`Elbow 45° ${sz} ${mat}`, 1, 'el45', 'EA'), A(`Coupling ${sz} ${mat}`, 1, 'piece', 'EA'), A(`Clevis hanger ${sz}`, 1, 'hanger', 'EA'), A('Threaded rod 3/8"', 2, 'hanger', 'LF'), ...(insul ? [A(`Pipe insulation ${sz} x ${insul}`, 1, 'qty', 'LF')] : [])];
  return [
    c({ name: 'Supply Duct 24x12', type: 'linear', color: '#e8590c', system: 'HVAC Supply', material: 'Galvanized steel', shape: 'rect', w: D(24), h: D(12), piece: L(5), hanger: L(8), waste: 10, asm: ductAsm('24x12', true) }),
    c({ name: 'Return Duct 20x10', type: 'linear', color: '#1971c2', system: 'HVAC Return', material: 'Galvanized steel', shape: 'rect', w: D(20), h: D(10), piece: L(5), hanger: L(8), waste: 10, asm: ductAsm('20x10', false) }),
    c({ name: 'Round Duct 10"', type: 'linear', color: '#1c7ed6', system: 'HVAC Supply', material: 'Galvanized spiral', shape: 'round', d: D(10), piece: L(10), hanger: L(10), waste: 10, asm: [A('Elbow 90° 10" round', 1, 'el90', 'EA'), A('Elbow 45° 10" round', 1, 'el45', 'EA'), A('Hanger strap 1" galv.', 1, 'hanger', 'EA'), A('Duct sealant', 0.01, 'sheet', 'GAL')] }),
    c({ name: 'Flex Duct 8"', type: 'linear', color: '#74c0fc', system: 'HVAC Supply', material: 'Insulated flex R-6', size: '8"', piece: L(25), hanger: L(5), waste: 10, asm: [A('Flex duct clamp 8"', 2, 'drop', 'EA'), A('Flex duct strap', 1, 'hanger', 'EA')] }),
    c({ name: 'Copper Type L 3/4"', type: 'linear', color: '#c2255c', system: 'Domestic Cold Water', material: 'Copper Type L', size: '3/4"', piece: L(20), hanger: L(6), waste: 5, asm: pipeAsm('3/4"', 'copper', '1" fiberglass') }),
    c({ name: 'Copper Type L 1/2" HW', type: 'linear', color: '#e64980', system: 'Domestic Hot Water', material: 'Copper Type L', size: '1/2"', piece: L(20), hanger: L(6), waste: 5, asm: pipeAsm('1/2"', 'copper', '1" fiberglass') }),
    c({ name: 'PEX 1/2"', type: 'linear', color: '#f783ac', system: 'Domestic Water', material: 'PEX-A', size: '1/2"', piece: L(100), hanger: L(2.67), waste: 5, asm: [A('Elbow 90° 1/2" PEX', 1, 'el90', 'EA'), A('PEX crimp ring 1/2"', 2, 'elbow', 'EA'), A('PEX clip 1/2"', 1, 'hanger', 'EA')] }),
    c({ name: 'Black Steel 2" Sch 40', type: 'linear', color: '#5f3dc4', system: 'Chilled Water', material: 'Black steel Sch 40', size: '2"', piece: L(21), hanger: L(10), waste: 5, asm: pipeAsm('2"', 'Sch 40', '1-1/2" fiberglass') }),
    c({ name: 'PVC DWV 4"', type: 'linear', color: '#2b8a3e', system: 'Sanitary', material: 'PVC DWV Sch 40', size: '4"', piece: L(20), hanger: L(4), waste: 5, asm: [A('1/4 bend 4" PVC DWV', 1, 'el90', 'EA'), A('1/8 bend 4" PVC DWV', 1, 'el45', 'EA'), A('Coupling 4" PVC DWV', 1, 'piece', 'EA'), A('Clevis hanger 4"', 1, 'hanger', 'EA'), A('PVC cement', 0.02, 'elbow', 'QT')] }),
    c({ name: 'Cast Iron No-Hub 4"', type: 'linear', color: '#495057', system: 'Storm', material: 'Cast iron no-hub', size: '4"', piece: L(10), hanger: L(5), waste: 5, asm: [A('1/4 bend 4" no-hub', 1, 'el90', 'EA'), A('1/8 bend 4" no-hub', 1, 'el45', 'EA'), A('No-hub coupling 4"', 1, 'piece', 'EA'), A('No-hub coupling 4"', 2, 'elbow', 'EA'), A('Clevis hanger 4"', 1, 'hanger', 'EA')] }),
    c({ name: 'Supply Diffuser 24x24', type: 'count', color: '#f08c00', system: 'HVAC Supply', material: 'Aluminum', size: '24x24', asm: [A('Flex duct 8"', 6, 'qty', 'LF'), A('Spin-in collar 8" w/ damper', 1, 'qty', 'EA')] }),
    c({ name: 'Return Grille 24x24', type: 'count', color: '#0c8599', system: 'HVAC Return', material: 'Aluminum', size: '24x24' }),
    c({ name: 'VAV Box', type: 'count', color: '#9c36b5', system: 'HVAC Supply', material: 'Terminal unit' }),
    c({ name: 'Tee 3/4" Copper', type: 'count', color: '#a61e4d', system: 'Domestic Cold Water', material: 'Wrot copper', size: '3/4"' }),
    c({ name: 'Reducer 3/4"x1/2" Copper', type: 'count', color: '#d6336c', system: 'Domestic Water', material: 'Wrot copper', size: '3/4"x1/2"' }),
    c({ name: 'Duct Transition', type: 'count', color: '#d9480f', system: 'HVAC Supply', material: 'Galvanized steel' }),
    c({ name: 'Fire Damper', type: 'count', color: '#c92a2a', system: 'HVAC Supply', material: 'UL 555 fire damper' }),
    c({ name: 'Ball Valve 3/4"', type: 'count', color: '#862e9c', system: 'Domestic Cold Water', material: 'Bronze', size: '3/4"' }),
    c({ name: 'Duct Wrap Insulation', type: 'area', color: '#0b7285', system: 'Insulation', material: 'Fiberglass 1-1/2" FSK', waste: 10 })
  ].map(applyDefaultLabor);
}
// Reference labor units (hours per unit). Starting points only: every company should set its own.
const LABOR_MAIN = { 'Supply Duct 24x12': 0.35, 'Return Duct 20x10': 0.3, 'Round Duct 10"': 0.2, 'Flex Duct 8"': 0.08, 'Copper Type L 3/4"': 0.12, 'Copper Type L 1/2" HW': 0.1, 'PEX 1/2"': 0.04,
  'Black Steel 2" Sch 40': 0.25, 'PVC DWV 4"': 0.15, 'Cast Iron No-Hub 4"': 0.2, 'Supply Diffuser 24x24': 1, 'Return Grille 24x24': 0.75, 'VAV Box': 4, 'Tee 3/4" Copper': 0.35,
  'Reducer 3/4"x1/2" Copper': 0.25, 'Duct Transition': 1, 'Fire Damper': 2, 'Ball Valve 3/4"': 0.4, 'Duct Wrap Insulation': 0.03 };
const LABOR_ASM = [[/^Elbow .*copper/i, 0.25], [/^Elbow .*Sch 40/i, 0.75], [/^Elbow .*PEX/i, 0.1], [/^Elbow .*round/i, 0.5], [/^Elbow .*\d+x\d+/i, 1], [/bend .*PVC/i, 0.4], [/bend .*no-hub/i, 0.4],
  [/^Coupling .*copper/i, 0.2], [/^Coupling .*Sch 40/i, 0.6], [/^Coupling .*PVC/i, 0.25], [/^No-hub coupling/i, 0.3], [/^Clevis hanger/i, 0.3], [/^Pipe insulation/i, 0.05], [/^Hanger strap/i, 0.15],
  [/^Duct wrap/i, 0.03], [/^Flex duct 8/i, 0.08], [/^Spin-in collar/i, 0.3], [/^PEX (crimp|clip)/i, 0.05], [/^Flex duct clamp/i, 0.05], [/^Flex duct strap/i, 0.1]];
function applyDefaultLabor(c) {
  c.labor = LABOR_MAIN[c.name] || 0;
  (c.asm || []).forEach(a => { const m = LABOR_ASM.find(([re]) => re.test(a.name)); a.lab = m ? m[1] : 0; });
  return c;
}
// Galvanized sheet weight, lb/ft² (incl. zinc coating)
const GA_LB = { 26: 0.906, 24: 1.156, 22: 1.406, 20: 1.656, 18: 2.156, 16: 2.656 };
// Approximate SMACNA low-pressure (up to 2" w.g.) gauge by largest dimension, inches
function autoGauge(c) {
  const k = S.units === 'imperial' ? 1 : 1 / 25.4;
  if (c.shape === 'rect') { const m = Math.max(+c.w || 0, +c.h || 0) * k; return m <= 12 ? 26 : m <= 30 ? 24 : m <= 54 ? 22 : m <= 84 ? 20 : 18; }

  if (e.button === 1 || spaceDown || (S.tool === 'select' && e.button === 0 && !e.target.closest('[data-id]') && !e.target.dataset.handle)) {
    const v = $('#viewer');
    pan = { x: e.clientX, y: e.clientY, sl: v.scrollLeft, st: v.scrollTop, moved: false };
    ov.style.cursor = 'grabbing'; e.preventDefault(); return;
  }
  if (S.tool === 'select' && e.button === 0) {
    if (e.target.dataset.handle) {
      pushUndo();
      drag = { id: e.target.dataset.hid, i: +e.target.dataset.handle };
      e.preventDefault(); return;
    }
    const g = e.target.closest('[data-id]');
    if (g) select(g.dataset.id);
  }
});
window.addEventListener('mousemove', e => {
  if (pan) {
    const v = $('#viewer');
    v.scrollLeft = pan.sl - (e.clientX - pan.x); v.scrollTop = pan.st - (e.clientY - pan.y);
    if (Math.abs(e.clientX - pan.x) + Math.abs(e.clientY - pan.y) > 3) pan.moved = true;
    return;
  }
  if (drag) {
    const it = S.items.find(x => x.id === drag.id);
    if (it) { it.points[drag.i] = evtPt(e); drawOverlay(); }
    return;
  }
  if (!S.pdf || e.target.closest('#overlay') == null && !S.draft) return;
  let p = evtPt(e);
  if (S.draft && S.draft.points.length && e.shiftKey && S.draft.type !== 'cloud') p = ortho(p, S.draft.points[S.draft.points.length - 1]);
  S.cursor = p;
  if (S.draft) { drawOverlay(); liveReadout(); }
});
window.addEventListener('mouseup', () => {
  if (pan) { if (!pan.moved && S.tool === 'select') select(null); pan = null; ov.style.cursor = S.tool === 'select' ? 'grab' : 'crosshair'; }
  if (drag) { drag = null; refresh(); }
});
ov.addEventListener('click', e => {
  if (!S.pdf || S.tool === 'select' || e.button !== 0 || spaceDown) return;
  let p = evtPt(e);
  const t = S.tool;
  if (e.detail >= 2) { if (t === 'linear' || t === 'area') finishDraft(); return; }
  if (t === 'count') { addCount(p); return; }
  if (t === 'text') { addText(p); return; }
  if (!S.draft) S.draft = { type: t, cond: S.activeCond, points: [] };
  const d = S.draft;
  if (d.points.length && e.shiftKey && t !== 'cloud') p = ortho(p, d.points[d.points.length - 1]);
  d.points.push(p);
  if ((t === 'calibrate' || t === 'cloud') && d.points.length === 2) finishDraft();
  drawOverlay();
});
ov.addEventListener('mouseleave', () => { S.cursor = null; drawOverlay(); });
$('#viewer').addEventListener('wheel', e => {
  if (!S.pdf) return;
  if (e.ctrlKey || e.metaKey || !e.shiftKey) {
    e.preventDefault();
    setZoom(S.zoom * Math.pow(1.0015, -e.deltaY), e.clientX, e.clientY);
  }
}, { passive: false });

function liveReadout() {
  const d = S.draft;
  if (!d || !S.cursor) { $('#stLive').textContent = ''; return; }
  const pts = [...d.points, S.cursor];
  const k = cal(S.pageNum);
  let txt = '';
  if (d.type === 'linear' || d.type === 'calibrate') {
    const L = polyLen(pts);
    txt = k ? 'Longitud: ' + fmtLen(L * k) : `Longitud: ${nf(L, 1)} pt (sin escala)`;
  } else if (d.type === 'area' && pts.length > 2) {
    const A = polyArea(pts);
    txt = k ? `Área: ${nf(A * k * k)} ${U().area}` : `Área: ${nf(A, 0)} pt² (sin escala)`;
  }
  $('#stLive').innerHTML = txt ? '<b>' + esc(txt) + '</b>' : '';
}

function finishDraft() {
  const d = S.draft; S.draft = null; $('#stLive').textContent = '';
  if (!d) return;
  if (d.type === 'calibrate') { if (d.points.length === 2) calibrateDialog(dist(d.points[0], d.points[1])); return; }
  const min = d.type === 'area' ? 3 : 2;
  if (d.points.length < min) { drawOverlay(); return; }
  pushUndo();
  const it = { id: newId('m'), page: S.pageNum, type: d.type, points: d.points };
  if (d.type !== 'cloud') it.cond = d.cond;
  S.items.push(it);
  if (isMeasure(it) && !cal(S.pageNum)) toast('Medición guardada. Calibra la escala para ver la cantidad real.');
  refresh();
}
function addCount(p) {
  pushUndo();
  let it = S.openCount && S.items.find(x => x.id === S.openCount);
  if (!it || it.page !== S.pageNum || it.cond !== S.activeCond) {
    it = { id: newId('m'), page: S.pageNum, type: 'count', cond: S.activeCond, points: [] };
    S.items.push(it); S.openCount = it.id;
  }
  it.points.push(p);
  refresh();
}
function addText(p) {
  modal(`<h3>Nota de texto</h3><div class="form"><label>Texto</label><input type="text" id="mText" autofocus></div>`, [
    { t: 'Cancelar' },
    { t: 'Agregar', primary: true, f: () => { const v = $('#mText').value.trim(); if (!v) return; pushUndo(); S.items.push({ id: newId('m'), page: S.pageNum, type: 'text', points: [p], text: v }); refresh(); } }
  ]);
}
function calibrateDialog(dpt) {
  if (dpt < 2) { toast('Los puntos están demasiado juntos'); return; }
  const imp = S.units === 'imperial';
  const fields = imp
    ? `<label>Distancia real</label><div class="row2"><input type="number" id="cFt" min="0" step="any" placeholder="pies" autofocus><input type="number" id="cIn" min="0" step="any" placeholder="pulgadas"></div><div class="hint">Ej.: 25 pies 6 pulgadas</div>`
    : `<label>Distancia real (m)</label><input type="number" id="cM" min="0" step="any" autofocus>`;
  const multi = S.numPages > 1 ? `<label>Aplicar a</label><select id="cAll"><option value="0">Solo esta página</option><option value="1">Todas las páginas</option></select>` : '';
  modal(`<h3>Calibrar escala</h3><div class="form">${fields}${multi}</div>`, [
    { t: 'Cancelar' },
    { t: 'Calibrar', primary: true, f: () => {
      const real = imp ? (+$('#cFt').value || 0) + (+$('#cIn').value || 0) / 12 : +$('#cM').value || 0;
      if (!(real > 0)) { toast('Escribe una distancia mayor que cero'); return false; }
      const all = S.numPages > 1 && $('#cAll').value === '1';
      applyScale(real / dpt, 'Calibrada (' + fmtLen(real) + ')', all);
      setTool('select');
    } }
  ]);
}

/* ---------- Selection & keyboard ---------- */
function select(id) {
  S.selected = id;
  if (id) { const it = S.items.find(x => x.id === id); if (it && it.cond) S.activeCond = it.cond; }
  drawOverlay(); renderTable(); renderConditions();
  const row = document.querySelector(`tr[data-id="${id}"]`); if (row) row.scrollIntoView({ block: 'nearest' });
}
function deleteSelected() {
  if (!S.selected) return;
  pushUndo();
  S.items = S.items.filter(x => x.id !== S.selected); S.selected = null; refresh();
}
window.addEventListener('keydown', e => {
  if ($('#modalBg').style.display === 'flex') {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter') { const b = $('#modal .primary'); if (b) b.click(); }
    return;
  }
  if (e.target.matches('input,select,textarea')) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); saveProject(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ') { spaceDown = true; ov.style.cursor = 'grab'; e.preventDefault(); return; }
  if (e.key === 'Escape') { S.draft = null; S.openCount = null; $('#stLive').textContent = ''; if (S.tool !== 'select') setTool('select'); else select(null); return; }
  if (e.key === 'Enter') { if (S.draft) finishDraft(); S.openCount = null; return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { deleteSelected(); return; }
  if (e.key === 'PageDown') { gotoPage(S.pageNum + 1); return; }
  if (e.key === 'PageUp') { gotoPage(S.pageNum - 1); return; }
  if (e.key === '+' || e.key === '=') { setZoom(S.zoom * 1.25); return; }
  if (e.key === '-') { setZoom(S.zoom / 1.25); return; }
  const map = { v: 'select', k: 'calibrate', l: 'linear', a: 'area', c: 'count', r: 'cloud', t: 'text' };
  if (map[k] && S.pdf) setTool(map[k]);
});
window.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; ov.style.cursor = S.tool === 'select' ? 'grab' : 'crosshair'; } });

/* ---------- Conditions panel ---------- */
function condTotals() {

  return t;
}

$('#btnNewCond').addEventListener('click', () => editCondition(null));

function addAsmRow(a) {

function readAsm() {

let confirmDelete = false;

/* ---------- Table ---------- */
function detailRows() {
  return S.items.filter(isMeasure).map((it, i) => {
    const c = condById(it.cond) || {}; const b = breakdown(it);
    return { it, c, b, i: i + 1 };
  });
}
function summaryRows() {
  const g = {};
  S.items.filter(isMeasure).forEach(it => {
    const c = condById(it.cond); if (!c) return;
    const b = breakdown(it);
    const r = g[c.id] || (g[c.id] = { c, q: 0, qw: 0, pieces: 0, sheet: 0, weight: 0, hangers: 0, el90: 0, el45: 0, cost: 0, hours: 0, n: 0, nocal: 0 });
    r.n++; if (!b.ok) { r.nocal++; return; }
    r.q += b.q; r.qw += b.qw; r.pieces += +b.pieces || 0; r.sheet += +b.sheet || 0; r.weight += +b.weight || 0; r.hangers += +b.hangers || 0; r.el90 += b.el90; r.el45 += b.el45; r.cost += b.cost; r.hours += b.hours;
  });
  // recompute pieces from the total (cutting from shared stock) instead of summing per run
  Object.values(g).forEach(r => { if (r.c.type === 'linear' && +r.c.piece > 0) r.pieces = Math.ceil(r.qw / r.c.piece - 1e-9); });
  return S.conditions.map(c => g[c.id]).filter(Boolean);
}
// Bill of materials: every condition's own material plus its assembly materials, merged by name + unit
function bomRows() {
  const m = new Map();
  const add = (name, unit, q, price, cost, from, hrs) => {
    const k = name + '|' + unit; const r = m.get(k) || { name, unit, q: 0, price, cost: 0, hrs: 0, from: new Set() };
    r.q += q; r.cost += cost; r.hrs += hrs || 0; if (price) r.price = price; r.from.add(from); m.set(k, r);
  };
  S.items.filter(isMeasure).forEach(it => {
    const c = condById(it.cond); if (!c) return; const b = breakdown(it); if (!b.ok) return;
    add(c.name, b.unit, b.qw, +c.price || 0, b.mainCost, c.name, b.mainHours);
    b.asm.forEach(a => add(a.name, a.unit, a.q, a.price, a.cost, c.name, a.hours));
  });
  return [...m.values()].map(r => { const whole = /^(EA|pza)$/i.test(r.unit); const q = whole ? Math.ceil(r.q - 1e-9) : r.q; return { ...r, q, cost: r.price ? q * r.price : r.cost, whole, from: [...r.from].join(', ') }; });
}
function estimate() {
  const e = S.est, sys = new Map();
  let mat = 0, hrs = 0;
  S.items.filter(isMeasure).forEach(it => {
    const c = condById(it.cond); if (!c) return; const b = breakdown(it); if (!b.ok) return;
    mat += b.cost; hrs += b.hours;
    const k = c.system || '—'; const r = sys.get(k) || { name: k, mat: 0, hrs: 0 }; r.mat += b.cost; r.hrs += b.hours; sys.set(k, r);
  });
  const tax = mat * (+e.tax || 0) / 100, labor = hrs * (+e.rate || 0), direct = mat + tax + labor;
  const oh = direct * (+e.oh || 0) / 100, profit = (direct + oh) * (+e.profit || 0) / 100, total = direct + oh + profit;
  const k = direct ? total / direct : 0;
  const systems = [...sys.values()].map(r => { const d = r.mat * (1 + (+e.tax || 0) / 100) + r.hrs * (+e.rate || 0); return { ...r, labor: r.hrs * (+e.rate || 0), direct: d, total: d * k }; });
  return { mat, tax, hrs, labor, direct, oh, profit, total, systems };
}
const money = v => '$' + nf(v || 0);
function unitOf(c) { return c.type === 'count' ? 'pza' : c.type === 'area' ? U().area : U().len; }

function exportPriceList() {

  });

  XLSX.writeFile(wb, 'SmartTakeoff_' + (expEN() ? 'price_list' : 'lista_precios') + '.xlsx');

async function importPriceList(f) {
  try {
    const wb = XLSX.read(await f.arrayBuffer());
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
    const pick = (r, re) => { const k = Object.keys(r).find(k => re.test(k)); return k ? r[k] : ''; };
    const list = new Map();
    rows.forEach(r => { const n = String(pick(r, /^(material|item|descrip|nombre|name)/i)).trim().toLowerCase(); if (n) list.set(n, { price: pick(r, /precio|price|cost/i), lab: pick(r, /hora|hour|labor|mo\b/i) }); });
    let n = 0; pushUndo();
    const val = v => v === '' || v == null ? null : +v;
    S.conditions.forEach(c => {
      const m = list.get(c.name.toLowerCase());
      if (m) { if (val(m.price) != null) c.price = val(m.price); if (val(m.lab) != null) c.labor = val(m.lab); n++; }
      (c.asm || []).forEach(a => { const m2 = list.get(a.name.toLowerCase()); if (m2) { if (val(m2.price) != null) a.price = val(m2.price); if (val(m2.lab) != null) a.lab = val(m2.lab); n++; } });
    });
    refresh(); toast(n ? `${n} material(es) actualizados` : 'No encontré materiales con el mismo nombre');
  } catch (err) { console.error(err); toast('No se pudo leer el archivo: ' + err.message); }
}

$('#unitsSel').addEventListener('change', e => {
  const to = e.target.value, from = S.units; if (to === from) return;
  pushUndo();
  const f = to === 'metric' ? 0.3048 : 1 / 0.3048;          // length base factor
  const fs = to === 'metric' ? 25.4 : 1 / 25.4;              // size factor (in <-> mm)
  Object.values(S.pages).forEach(p => { if (p.cal) p.cal *= f; });
  S.items.forEach(it => { if (it.vert) it.vert = +(it.vert * f).toFixed(3); });
  S.conditions.forEach(c => {
    c.piece = +(c.piece * f).toFixed(3); c.hanger = +(c.hanger * f).toFixed(3);
    c.w = +(c.w * fs).toFixed(2); c.h = +(c.h * fs).toFixed(2); c.d = +(c.d * fs).toFixed(2);
    if (c.price) c.price = +(c.price / (c.type === 'area' ? f * f : c.type === 'linear' ? f : 1)).toFixed(4);
  });
  S.units = to; refresh();
  toast(to === 'metric' ? 'Unidades métricas (m, m², mm)' : 'Unidades imperiales (ft, ft², in)');
});

$('#fileCond').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer());
    const ws = wb.Sheets['Condiciones'] || wb.Sheets['Conditions'] || wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
    const pick = (r, re) => { const k = Object.keys(r).find(k => re.test(k)); return k ? r[k] : ''; };
    const tmap = s => /área|area/i.test(s) ? 'area' : /conteo|count|pza|pieza|^ea$/i.test(s) ? 'count' : 'linear';
    let n = 0; pushUndo();
    rows.forEach(r => {
      const name = String(pick(r, /^(nombre|condici|name|item|descrip)/i)).trim(); if (!name) return;
      const forma = String(pick(r, /^forma|shape/i));
      const c = { id: newId('c'), name, type: tmap(String(pick(r, /^tipo|type/i))), color: /^#[0-9a-f]{6}$/i.test(pick(r, /^color/i)) ? pick(r, /^color/i) : '#' + Math.floor(Math.random() * 0xaaaaaa).toString(16).padStart(6, '0'),
        system: String(pick(r, /^sistema|system/i)), material: String(pick(r, /^material/i)), size: String(pick(r, /^tama|size/i)),
        shape: /rect/i.test(forma) ? 'rect' : /redond|round/i.test(forma) ? 'round' : 'none',
        gauge: String(pick(r, /^calibre|gauge/i) || 'auto'), w: +pick(r, /^ancho|width/i) || 0, h: +pick(r, /^alto|height/i) || 0, d: +pick(r, /^di[aá]m/i) || 0,
        piece: +pick(r, /^largo pieza|piece/i) || 0, hanger: +pick(r, /^soporte|hanger/i) || 0, waste: +pick(r, /^desperd|waste/i) || 0, price: +pick(r, /^precio|price|costo unit/i) || 0, labor: +pick(r, /^(horas|labor)/i) || 0 };
      if (!/^(auto|16|18|20|22|24|26)$/.test(c.gauge)) c.gauge = 'auto';
      const ex = S.conditions.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (ex) Object.assign(ex, c, { id: ex.id, type: ex.type, asm: ex.asm || [] }); else S.conditions.push(c);
      n++;
    });
    const wsA = wb.Sheets['Ensambles'] || wb.Sheets['Assemblies'];
    if (wsA) {
      const ar = XLSX.utils.sheet_to_json(wsA, { defval: '' }); const touched = new Set();
      ar.forEach(r => {
        const cn = String(pick(r, /^(condici|item|condition)/i)).trim(), mn = String(pick(r, /^material/i)).trim(); if (!cn || !mn) return;
        const c = S.conditions.find(x => x.name.toLowerCase() === cn.toLowerCase()); if (!c) return;
        if (!touched.has(c.id)) { c.asm = []; touched.add(c.id); }
        const base = String(pick(r, /^(por|per)$/i)).trim();
        c.asm.push({ lab: +pick(r, /^(horas|labor)/i) || 0, name: mn, f: +pick(r, /^factor/i) || 0, base: ASM_BASES.some(b => b[0] === base) ? base : 'qty', unit: String(pick(r, /^(unidad|unit)$/i) || 'EA'), price: +pick(r, /^precio|price/i) || 0 });
      });
    }
    refresh(); toast(n ? `${n} condición(es) importadas o actualizadas` : 'No encontré filas con columna “Nombre”');
  } catch (err) { console.error(err); toast('No se pudo leer el archivo: ' + err.message); }
});

function modal(html, buttons, onCancel) {

  const act = $('#modal .actions');
  buttons.forEach(b => {
    const el = document.createElement('button'); el.textContent = b.t;
    if (b.primary) el.className = 'primary';
    if (b.danger) { el.style.color = 'var(--danger)'; el.style.marginRight = 'auto'; }
    el.addEventListener('click', () => { if (b.f && b.f() === false) return; closeModal(!b.f); if (!b.f && onCancel) onCancel(); });
